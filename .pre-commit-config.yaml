repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks secret scan
        # No Go toolchain on dev machines, so we can't use gitleaks' own
        # golang-language pre-commit hook — call the installed binary directly.
        entry: C:/Users/mhammett.HAMMETT/Claude/tools/gitleaks/gitleaks.exe git --staged --pre-commit --redact --no-banner --verbose
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        # CI runs `mypy packages/<pkg>/src`, so scope the hook to the same files.
        # Without this the hook also picks up the test files, which share names
        # across packages, and mypy aborts on a duplicate-module error before
        # checking anything at all.
        files: ^packages/[^/]+/src/

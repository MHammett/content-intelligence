name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ci-core, ci-article-review, ci-style-profile]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check packages/${{ matrix.package }}

      - name: Format check
        run: uv run ruff format --check packages/${{ matrix.package }}

      - name: Type check
        run: uv run mypy packages/${{ matrix.package }}/src

      # Each leg runs one package, and one package's tests cannot collide with
      # another's: that takes the repo-wide session `make test` runs, which is
      # where conftest.py's guard against same-named test modules acts.
      # Collecting that session once runs the guard; it needs no fourth job.
      - name: Collect all packages' tests in one session
        if: matrix.package == 'ci-core'
        run: uv run pytest packages/ --collect-only -qq

      - name: Test
        run: uv run pytest packages/${{ matrix.package }} --cov=packages/${{ matrix.package }}/src --cov-report=term-missing

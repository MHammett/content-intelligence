name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 4 AM

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action calls GET /pulls/{n}/commits on every pull_request-triggered
    # run to determine the commit range to scan — needs pull-requests:read even
    # though this workflow itself never touches PR metadata.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

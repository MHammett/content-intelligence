#
#                                  provider      streams  worst fb  worst gap
#                                  claude-haiku-4-5   9      6.0s      3.5s
#                                  gemini-3.5-flash  11     58.8s      0.5s
#                                  grok-4.3           6      1.4s      0.6s
#                                  mistral-small     15      1.0s      1.8s
#                                  openai            30     16.4s     21.2s
#                                  perplexity/sonar   3     19.9s      0.3s
#
#                                NOTHING came near a budget, so 12-way

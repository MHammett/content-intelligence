# Cost presets — controls model selection, reasoning depth, and thoroughness as a bundle.
# Edit this file to update model names when providers release new versions.
# See docs/CONFIGURATION.md for full documentation.
#
# Behavior when cost_preset is set in user.yaml:
#   - Sets thoroughness (unless user also set thoroughness: explicitly).
#   - Overrides model name and reasoning flags for each configured provider.
#   - Preserves infrastructure keys: provider, project, location, credentials_file,
#     endpoint, deployment, api_version, prompts, web_search, the search controls
#     (search_mode, search_recency_filter, search_domain_filter,
#     search_context_size), temperature, timeout_seconds, max_tokens,
#     stream_read_timeout and
#     stream_gap_timeout. Where a tier below sets one of these too — the
#     stream_read_timeout values are the only ones that do — the user's wins, and
#     config load warns when theirs is the lower of the two.
#   - Skips providers with no API key or no models: entry in user.yaml.
#   - Respects enabled: false set by the user — disabled models stay disabled.
#
# Per-article cost is MEASURED, not estimated, and every figure belongs to the
# draft it was measured on. The table lives beside `cost_preset:` in
# user.example.yaml, in this directory; docs/CONFIGURATION.md, "Cost presets",
# carries the same figures with their run counts and each draft's size in
# characters. They are deliberately not copied here a third time: this list held
# unsized estimates from a 1,500-word model of per-call tokens, and kept them
# after both of those moved to measured figures (8e4de54, 2026-09-19).
#
# Read every figure there as a floor, not a quote: token costs only — per-search
# and per-request fees come on top — and a retried attempt the provider billed
# without reporting usage is priced at $0.00. For scale, on one ~19,500-word
# draft `wide` averaged $0.38 over three runs and one `maximum` run came to about
# $9.6, roughly 25x as much. Cost grows far more slowly than the draft does — at
# `maximum`, 7.5x the characters cost about 1.6x the money — so a figure without
# its draft size says nothing.
#
# The tiers, cheapest first, are economy, wide (the shipped default in
# user.example.yaml), balanced, thorough and maximum. `standard` was retired
# 2026-09-05: it still runs, as `wide`, with a warning — see the note under
# `wide:`, which is also where the wide-against-standard cost comparison lives.
#
# Mistral note: mistral-medium-3-5 only accepts reasoning_effort "high" or "none".
#   "low" and "medium" return 400. Standard models do not support reasoning_effort at all.
# Grok note: grok-4.6 (released 2026-08-12, replacing 4.20-reasoning below) is the
#   first Grok model with a real reasoning_effort parameter (low/medium/high/xhigh,
#   default high) instead of reasoning being model-selection only.
#
#   VERIFIED 2026-09-05, which this note previously asked for. litellm passes
#   reasoning_effort straight through to xAI: no client-side reject, no
#   UnsupportedParamsError, and none of the allowed_openai_params escape hatch
#   mistral needs. grok honours it, measured on one prompt, two samples each:
#
#       effort     completion tokens    latency
#       (unset)      1100, 1180          ~20s
#       low           345,  415           ~7s
#       high         1025, 1101          ~18s
#
#   The reason this now appears in every tier below rather than nowhere: unset
#   is NOT off. It resolves to the provider default, which for grok-4.6 is
#   high — so leaving it blank was buying the most expensive setting by
#   accident, and `balanced`, whose whole description is "light reasoning on
#   key models", was running grok at high while carefully setting openai to low
#   and claude to medium. Every tier now states what it wants.
#
#   grok-4.3 at `wide` is left unset deliberately: it predates the parameter,
#   where reasoning was model-selection only, and sending one risks a 400 for
#   no gain.
#
# 2026-08-18 model refresh: OpenAI's gpt-5.6 family (Sol/Terra/Luna, launched
# 2026-07-09) replaces 5.5/5.4/5.4-mini at matching price tiers; Anthropic's
# opus-5/sonnet-5 replace opus-4-8/sonnet-4-6; xAI's grok-4.6 replaces
# 4.20-0309-reasoning. Gemini and Mistral are UNCHANGED this round: Gemini 3 is
# still preview-only on Vertex AI as of this date (see the maximum tier's gemini
# note) and ci-discover found no newer Mistral model than mistral-medium-3-5.
#
# 2026-09-27 Gemini refresh. Gemini 2.5 Pro, Flash and Flash-Lite are listed to
# retire on Vertex AI on 2026-10-20 (Google Cloud's "Model versions and
# lifecycle" page, read 2026-09-19; the Gemini API lists no date). Google names
# gemini-3.5-flash as 2.5 Pro's replacement and gemini-3.5-flash-lite (or 3.1
# Flash-Lite) as 2.5 Flash's. Every tier here runs 3.5 Flash, at `thinking_level`
# low (economy, wide, balanced), medium (thorough) and high (maximum); 3.5
# Flash-Lite is the client's fallback and default model. 3.1 Flash-Lite is not
# used: the Gemini API already lists its shutdown, 2027-05-07, with 3.5 Flash-Lite
# as the replacement.
#
# MEASURED 2026-09-27, one run per row, gemini fact_check only, on the 9,456-char
# short-example draft, Vertex AI (`us`). Tokens are priced at list; queries are
# Google searches, billed at $14 per 1,000 after 5,000 a month free (2.5 Pro is
# billed once per call that searched). One run each is a sample, not a
# measurement: the saved `wide` runs of 2.5 Flash on this draft (4, one failed)
# found the outdated BEAD claim in one of three.
#
#   model, level            out tokens  queries  seconds  tokens $  outdated BEAD claim
#   2.5 Pro, budget 16000        5,185        6       49    $0.06   found
#   3.5 Flash, high             18,621       77      135    $0.18   found
#   3.5 Flash, medium           13,463       82      136    $0.13   found
#   3.5 Flash, low               2,725       20       25    $0.03   found
#   3.5 Flash-Lite, medium       1,858        8       10    $0.007  missed
#   3.5 Flash-Lite, low          1,033        0        5    $0.004  missed
#   3.8 Flash, high             27,319       89      259    $0.16   found (two attempts
#                                                                   returned malformed JSON)
#
# So the level decides whether it searches at all, and 3.5 Flash searches far more
# than 2.5 Pro did: 103 queries over the five maximum domains against 16, which at
# list price is $1.44 of a $2.02 Gemini bill for that run. The first 5,000 queries
# a month are free, and the cost report prices every one at list, so its estimate
# runs ahead of the bill (about 48 maximum runs a month spend the allowance).
# `low` is the cheap tiers' level because it costs what 2.5 Flash did (it thinks
# 4x less), still searches, and found what the Flash-Lites missed; and economy's
# only fact-checker is gemini. Three things differ from 2.5, each captured on the
# wire against litellm 1.96.2:
#
#   * Thinking is a LEVEL, `thinking_level`: minimal, low, medium or high. litellm
#     discards a `thinking_budget` on a gemini-3 model (it sends
#     {includeThoughts: true} alone), so the 16000 that `maximum` carried would
#     have become Google's default level, MEDIUM on 3.5 Flash, without a word.
#   * Vertex serves these models at `global` and the `us` and `eu` multi-regions
#     and at no regional endpoint, `us-central1` included (Google's "Deployments
#     and endpoints" tables; BerriAI/litellm#37989 is the 404). The client picks
#     `us` for them (ci_core.llm.vertex), whatever location user.yaml carries.
#   * No temperature is sent to them. Google says to keep 1.0 on every Gemini 3
#     model; see client._temperature.
#
# 2026-09-28 Perplexity refresh. Perplexity supported its Sonar chat-completions
# API until 2026-09-27 and names its Agent API as the successor. Every tier now
# runs `perplexity/sonar` there, the same Sonar model on the new API: `sonar`
# (economy, wide) and `sonar-reasoning-pro` (balanced, thorough, maximum) both
# became it. An id with a "/" goes to the Agent API through Perplexity's own SDK;
# a bare `sonar*` id still goes to the old API through litellm
# (client._uses_agent_api; docs/PROVIDERS.md says why not litellm).
#
# The Agent API hands the model a web_search tool instead of searching before
# every call, so the seat now decides when to search. MEASURED 2026-09-28 with
# `ci-review --only-model perplexity --offline` on this file's `maximum` tier,
# fact_check only; medians of three runs a draft (two on short-example). "URLs"
# is the share of the URLs its findings cite that are among the sources it
# retrieved. perplexity/sonar's cost is Perplexity's own figure (usage.cost),
# which pricing.yaml reproduces to the cent; the other rows are pricing.yaml's.
#
#   draft, chars              model                 sources  URLs  confirmed  seconds   cost
#   gps-rollover, 31,112      sonar-reasoning-pro        15   53%          8      186  $0.069
#                             perplexity/sonar           44   89%         16       64  $0.037
#   dc-environment, 135,514   sonar-reasoning-pro        15   30%          5      116  $0.108
#                             perplexity/sonar           45   81%         10       34  $0.037
#   short-example, 9,456      sonar                      15   60%          4       21  $0.013
#                             perplexity/sonar           44   89%       10.5       30  $0.024
#
# All five domains at once on gps-rollover, one run each: sonar-reasoning-pro took
# 168s and $0.215 for 37 findings (its argument_integrity call returned none, in
# 14 output tokens); perplexity/sonar took 40s and $0.063 for 114. No call failed
# in either arm or anywhere above. perplexity/sonar searched on every fact_check
# call (10 of 10, one to three searches, 15 to 45 sources) and on none of the
# other domains' calls (0 of 8, over this run and one on short-example); Sonar
# searched on every call because it could not do otherwise. Those four domains
# review the draft's own writing, and the seat returned more findings on each
# than sonar-reasoning-pro did, or as many.
#
# Watch: one gps-rollover fact_check returned 163 findings (its repeats 56 and
# 52), and the five-domain voice_style call raised 35 flags against 1. More
# findings is not better findings, and nothing here measured whether the extra
# ones survive consolidation as signal.
#
# Screened on gps-rollover and not taken: kimi-k3, glm-5.3 and
# nemotron-3-ultra-550b-a55b never called web_search (the first two returned
# nothing, nemotron 30 unsourced findings). deepseek-v4-pro-0813 searched well (69
# sources) but cost $0.26 and 198s, truncated its output, and on repeat returned
# malformed JSON and then ran out its time. openai/gpt-5.6-luna retrieved best of
# all, but it is OpenAI's model, which the openai seat already runs, so the
# ensemble would lose a model family. `max_steps: 3` on perplexity/sonar sourced
# no better and returned 140 findings, 79 of them out of scope.
#
# No stream_read_timeout override is left for perplexity. sonar-reasoning-pro's
# search was one silence before its first byte, which is why thorough and maximum
# carried 500 (see the CONCURRENCY note below); the longest measured above was
# 264s. The Agent API sends an event at each step of its search and each one
# restarts the silence clock, so over 19 perplexity/sonar streams the longest
# silence before output was 58s and the longest gap after it 0.24s, against the
# grounded default of 160. These runs sent Perplexity at most five calls at once,
# one per domain, which is what a full run sends it before any backfill or
# citation re-ask; the other providers' calls were not running alongside.
#
# Cost: where the tiers ran sonar-reasoning-pro, the seat's fact_check fell from
# $0.07-0.11 to about $0.04 a call on the two real drafts, and the five-domain
# pass from $0.215 to $0.063. Where they ran `sonar` (economy, wide) it rose, from
# $0.013 to $0.024 a call on short-example, for three times the sources. Search
# is now billed per search ($0.0025), where Sonar billed a request fee on every
# call.
#
# stream_read_timeout note: the review adapters stream (SSE). There are now TWO
# streaming knobs, and they do different jobs (see ci_core/llm/streaming.py):
#
#   stream_read_timeout — the FIRST-BYTE allowance, i.e. the socket read timeout.
#     Covers everything before generation starts: queueing, a grounded model's web
#     search, and any reasoning done with zero bytes on the wire. Necessarily large
#     for grounded models. This is what every value below is sizing.
#   stream_gap_timeout  — the INTER-CHUNK gap once the stream has started, i.e. the
#     liveness detector. Defaults to 60s for every provider and should almost never
#     be overridden: a stream that has begun emitting keeps emitting, so a long
#     silence mid-response means a dead connection, not a slow model.
#
# These used to be one value, which is why the numbers below crept upward: each
# bump was chasing a slow-but-alive call, and the side effect was that a genuinely
# dead connection took just as long to notice. Slow-but-alive is the wall-clock
# backstop's job (configs/timeouts.yaml); the gap only catches dead.
#
# High/xhigh reasoning effort can produce a long SILENT period — zero bytes on the
# wire, not even a keep-alive — while the model reasons before emitting visible
# output. That is a first-byte problem, so it belongs to stream_read_timeout.
#
# ── CONCURRENCY IS THE AXIS, NOT DRAFT SIZE (measured 2026-09-09) ─────────────
#
# Two maximum-preset runs on an 18,167-char draft produced eight stalls across
# three providers and BOTH phases. Run 1 lost grok:red_team outright (it stalled
# twice, at 337.56s and 302.16s); run 2 stalled seven calls, all of which then
# recovered:
#
#   provider / model     phase         elapsed when it gave up
#   grok-4.6             first-byte    337.56s, 302.16s (run 1) · 314.10s (run 2)
#   claude-opus-5        first-byte    253.31s, 343.85s
#   gpt-5.6-sol          mid-stream    355.87s, 358.90s, 399.74s, 531.59s
#
# None of these was short of WALL-CLOCK budget. grok:red_team was killed with
# 782.8s of its 1085s budget unspent — dead at 28% utilisation, 0 output tokens.
# The socket budgets, not timeouts.yaml, ended every one of these calls.
#
# DO NOT "FIX" THIS BY SCALING THESE VALUES WITH DRAFT SIZE. That is the
# intuitive move — timeouts.yaml scales its wall-clock budget that way — and on
# this evidence it makes things strictly WORSE. 18,167 chars lands in the
# `max_chars: 20000` bucket, whose multiplier is 0.8. A size-scaled first-byte
# allowance would have been 120 x 0.8 = 96s, and every failure above would have
# been killed EARLIER. The draft here was small; the failures were not.
#
# What they correlate with is FAN-OUT, and the repo already measured that axis:
# see client.py's openai provider entry, 2026-08-16 — "gpt-5.5 at xhigh exceeds
# 60s between reasoning-summary deltas when the pipeline runs six of them at
# once (a single call shows a 1.3s worst gap; concurrency is what stretches
# it)". maximum fans out to 29 in-flight ensemble calls, and run 2's recovery
# pass re-ran 7 of them and got all 7 back. That is the same mechanism one tier
# further along, not a new one.
#
# CLAUDE ALSO HAD A CAUSE THAT IS NOT FAN-OUT (measured 2026-09-18). One
# claude-opus-5 fact_check run entirely alone (--only-model claude
# --only-domain fact_check --offline, 28,746-char gps-rollover draft) stalled
# first-byte at >120.02s and >120.01s, then took 113.49s on the recovery pass.
# opus-5's thinking display defaults to "omitted", which puts nothing on the
# wire while it thinks, so each thinking phase was one silence however few
# calls were running. client.py now asks for display "summarized" wherever a
# claude request thinks adaptively (see _provider_params). The same isolated
# pass then ran as a single stream: first output at 252.15s, yet
# first_byte=7.01s, max_gap=0.45s.
# Fan-out may still lengthen claude's silences; that is unmeasured, and no
# value in this file changed.
#
# CONSEQUENCE FOR CALIBRATION: measuring ONE call at a time (--only-model /
# --only-domain / --no-timeout) is the correct method for the WALL-CLOCK cells
# in timeouts.yaml, and cannot measure these two knobs at all. By the 2026-08-16
# number above, an isolated call shows a ~1.3s gap — it reproduces the healthy
# case by construction, and a value set from it would be calibrated against the
# condition that never fails. To size these, vary CONCURRENCY at fixed draft
# size and record worst first-byte and worst inter-chunk gap per provider.
# Both are recorded as of 2026-09-17: each [CALIBRATION] line ends with
# `first_byte=` and `max_gap=`, the longest silence before and after real
# output began — the numbers these two knobs bound — one value per stream, and
# a stall written as a lower bound (`>120.02s`), never as the budget. The same
# values, with the budgets in force, are in each report's
# api_call_log[].stream_timing, including the streams of calls the recovery
# pass later got back. Stage 0 of that experiment — grok alone — HAS been run
# (2026-09-18, 28 streams, raw data in pipeline_history/_experiments/
# 2026-09-18-stage0-grok-silences/), and grok's entries below are sized from it.
# The other providers' stages have not, so nothing else here is set from a
# measurement of these two knobs; the perplexity entry this file carried until
# 2026-09-28 is the standing reminder of what guessing costs instead (160 -> 280
# -> 350 -> 500, three bumps that each looked marginal within days). It went
# because the model behind it did, not because the experiment ran; see the
# Perplexity refresh note.
#
# OpenAI: originally hit this hard — gpt-5.5 at xhigh failed 5/5 calls at ~121s
# with 0 output tokens against the default 120s read-gap under Chat Completions,
# which carries no signal at all during the reasoning phase. Fixed by migrating
# the adapter's primary path to the Responses API with reasoning.summary
# enabled (ci_core/llm/adapters/openai.py): response.reasoning_summary_text.delta
# events stream real bytes DURING the silent phase. Live-verified (2 xhigh
# calls, no override, default 120s read-gap): reasoning-summary deltas start
# ~2-6s in and recur throughout, with a worst observed gap of ~8s — no longer
# anywhere near the 120s default, so no per-model override is needed for
# openai here anymore.
#
# Mistral was NOT migrated (still Chat Completions, no reasoning-summary
# equivalent available) and keeps its stopgap bump: mistral-medium-3-5 high
# effort saw a marginal timeout in the wild (124s vs the 120s default).
# Worth revisiting: streaming.accumulate_chat_completions shows Mistral emits
# typed {"type": "thinking"} chunks in delta.content, so it may already be
# feeding the socket during reasoning and not need the override at all. Measure
# with --no-timeout before removing it.
#
# Gemini thinking: each tier below states a `thinking_level`, and that is what
# turns the thought summaries on. The old hand-written adapter sent
# thinkingConfig.includeThoughts unconditionally; the litellm client sends it only
# with a level (or, on 2.5, a `thinking_budget`), and a request with neither goes
# out with no thinkingConfig at all. The model still thinks, at Google's default
# for it (MEDIUM on 3.5 Flash, MINIMAL on the Flash-Lites), but silently: no thought
# summary reaches the socket while it does, which is first-byte pressure. Measured
# on the wire, 2026-09-19.

economy:
  thoroughness: standard
  models:
    openai:
      model: gpt-5.6-luna   # was gpt-5.4-mini; matching price tier, 2026-08-18 refresh
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-flash; see the Gemini refresh note above
      thinking_level: low
    mistral:
      model: mistral-small-latest
    perplexity:
      model: perplexity/sonar   # was sonar; see the Perplexity refresh note above
    grok:
      enabled: false
    claude:
      enabled: false

# CANDIDATE B, under evaluation 2026-09-05. Same cheap models as `draft` plus
# the two `draft` leaves off. Distinct model count, not per-domain width, is what
# lets a passage reach three voters -- consensus counts models across domains --
# so a four-model ensemble can corroborate at two and almost never at three.
wide:
  thoroughness: thorough
  models:
    openai:
      model: gpt-5.6-luna
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-flash; see the Gemini refresh note above
      thinking_level: low
    mistral:
      model: mistral-small-latest
    perplexity:
      model: perplexity/sonar   # was sonar; see the Perplexity refresh note above
    grok:
      model: grok-4.3
    claude:
      model: claude-haiku-4-5-20251001

# `standard` was retired 2026-09-05. `wide` above dominated it on every axis
# measured -- more corroborated consensus, more claims, more findings that
# survive a rerun -- at lower cost on the one draft they were compared on; a
# tier that costs more for less is not a rung on a cost/benefit ladder. An
# existing `cost_preset: standard` still runs (as `wide`) and warns; see
# _RETIRED_PRESETS in config_loader.py. The retirement is settled; what it cost
# is what keeps going stale, so every figure below carries its basis, the draft
# length, and the date of the price table it was priced against.
#
# The first figure overstated the saving. The comparison measured `wide` at 55%
# of `standard`'s cost ($0.119 against $0.215, three isolated runs each, one
# 1,392-word draft), but it counted tokens only and priced mistral-large 6x too
# high and mistral-small too low. Both rows were verified 2026-09-18 and
# corrected in #216; #230 (2026-09-19) then began billing search and grounding
# fees; #235 (2026-09-20) re-priced sonar; #252 (2026-09-28) moved every preset
# off gemini-2.5-flash.
#
# CURRENT, tokens only, priced 2026-09-30 against ci-core's pricing.yaml of that
# date, on the 9,456-char (~1,400-word) smoke draft, over the three complete
# saved `wide` captures:
#
#     `wide` costs 73-79% of `standard`.
#
# 73.1 / 78.1 / 74.7% per run as #233 built the rebuild, and 74.1 / 78.5 / 77.0%
# with the perplexity citation re-asks charged to `wide` alone -- which is what
# the code does: reask_refuted hands a refuted claim back to its own
# `source_model` and the pipeline passes no fallback_provider, so a preset that
# gave perplexity no ensemble domain can have no perplexity claim to re-ask. The
# rest of the citation pass still differs between the presets in ways a rebuild
# cannot model, which is why this is a band and not a number.
#
# Method, unchanged from #233: rebuild `standard` out of each captured `wide`
# run's own api_call_log -- drop the five calls only `wide` makes, re-point
# openai voice_style/completeness from gpt-5.6-luna to gpt-5.6-terra and mistral
# argument_integrity/red_team from mistral-small to mistral-large, every call
# keeping its reported tokens -- then price through ci_core.llm.cost.calculate.
# Prompts are model-independent; completions are a proxy. The seven ensemble
# calls this leaves match, pass for pass and model for model, three real
# `standard` runs still on disk. pipeline_history is per-checkout and
# gitignored, and all three are in the content-intelligence-audit-fixes
# worktree, not the main one: pipeline-and-verification-update run_1 and run_2
# (2026-09-04) and data-centers-dont-have-an-environmental... run_20
# (2026-09-05). None of the three got far enough into the citation pass to show
# what it would have cost there.
#
# Calibrated twice, and neither check may be skipped: at the pre-#216 rates the
# rebuild gives 56.6 / 57.1 / 57.5% against the 55.3% actually measured, and at
# #233's own table (c5a4acf, pre-#235) it reproduces #233's published
# 72.1 / 76.9 / 73.7% exactly. Of the rows the rebuild touches, only #235's
# sonar has moved since #233 -- claude-haiku-4-5 gained a cached-input rate, and
# these captures report no cached tokens -- so #235 is the whole of the change.
# 73.5 / 78.3 / 75.7% is NOT that change, though the arithmetic is tempting:
# that is `wide` at the new sonar rate over `standard` at the old one, crediting
# `wide` alone for an increase both presets pay on their citation re-asks.
#
# NOT re-derived. Do not quote these as current:
#   - #216's scaling of two complete `standard` runs onto the measured $0.215,
#     which gave 76-86%. Pre-#235, and #235 also moved sonar-pro
#     ([1.00, 8.00] -> [3.00, 15.00]), the perplexity model `standard` named.
#   - The fee bases, 80-84% / 80-89% / about 95-101%. They injected search
#     counts into captures that predate #230 and carry none, and they assumed
#     Gemini 2.5's flat $35 per 1,000 grounded prompts. #252 put every preset on
#     gemini-3.5-flash, which bills $14 per 1,000 QUERIES instead -- 11-16 of
#     them on a single fact_check in the 2026-09-28 `wide` runs recorded in
#     CLAUDE.md. They are kept as a record of the reasoning about a fee model
#     that no longer applies, not as figures.
#
# #252 may have reversed the sign, and not only through fees: gemini-3.5-flash
# is [1.50, 9.00] against 2.5-flash's [0.30, 2.50]. `wide` makes two gemini
# calls with 8-12K-token completions (the shared fact_check, plus the
# voice_style only it makes, standing in for claude, which drafted these runs)
# where `standard` makes one, so the rise lands hardest on `wide`. Carry the
# same captured token counts onto today's models (gemini-3.5-flash,
# perplexity/sonar) on both sides and the rebuild gives 105.2 / 110.1 / 103.6%
# -- `wide` costing MORE on tokens alone, before any fee -- or 97.0-108.7% if
# `standard`'s re-asks run sonar-pro. That is a bound, not a measurement: it
# prices 2.5-Flash's output lengths at 3.5-Flash's rate, and 3.5-Flash's own
# output lengths on these prompts have never been measured. Read "`wide` cost
# less" as a statement about the 2026-09-05 line-up at 2.5-Flash prices, and
# settle today's with a live A/B rather than arithmetic: the retired preset
# rebuilt from `git show 3a16fd4^:<this file>`, three runs each on the smoke
# draft, roughly $1 at current rates. Not run.
#
# The six original runs are not among the saved runs, so none of this can be
# checked against them, and only one draft length was ever compared: read every
# figure above as belonging to a ~1,400-word draft. Nothing user-facing quotes a
# percentage, for that reason.

balanced:
  thoroughness: thorough
  models:
    openai:
      model: gpt-5.6-terra   # was gpt-5.4; matching price tier, 2026-08-18 refresh
      reasoning_effort: low
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-flash; see the Gemini refresh note above
      thinking_level: low
    mistral:
      model: mistral-medium-3-5
      # No reasoning_effort at balanced — mistral-medium-3-5 only accepts "high" or "none"
    perplexity:
      model: perplexity/sonar   # was sonar-reasoning-pro; see the Perplexity refresh note above
    grok:
      model: grok-4.6   # was grok-4.20-0309-reasoning; see the Grok note above
      reasoning_effort: low   # this tier's stated intent. Unset meant the
                              # provider default, which is high — the one
                              # setting `balanced` is explicitly not asking for.
    claude:
      model: claude-sonnet-5   # was claude-sonnet-4-6; 2026-08-18 refresh
      effort: medium

thorough:
  thoroughness: thorough
  models:
    openai:
      model: gpt-5.6-terra   # was gpt-5.4; matching price tier, 2026-08-18 refresh
      reasoning_effort: high
      # No stream_read_timeout override — Responses API + reasoning.summary
      # keeps the default 120s read-gap safe (see the note above).
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-pro; see the Gemini refresh note above
      thinking_level: medium   # Google's default for it; stated so the thought summaries stream
    mistral:
      model: mistral-medium-3-5
      reasoning_effort: high
      stream_read_timeout: 200   # not migrated — see the Mistral note above
    perplexity:
      model: perplexity/sonar   # was sonar-reasoning-pro; see the Perplexity refresh note above
      # No stream_read_timeout override, where sonar-reasoning-pro had 500. That
      # was sized for its search: one silent stretch before the first byte, which
      # took three bumps (160 -> 280 -> 350 -> 500) to outrun. The Agent API sends
      # an event at each step of its search, and each restarts the silence clock,
      # so the grounded default of 160s now bounds the longest single silence,
      # not the whole search. Measured in the refresh note above.
    grok:
      model: grok-4.6   # was grok-4.20-0309-reasoning; see the Grok note above
      reasoning_effort: high   # what unset already resolved to; stated so the
                               # tier says what it does. xhigh exists and is
                               # unmeasured, so it is not reached for here.
      # FIRST-BYTE, measured rather than guessed: stage 0 of the concurrency
      # experiment described at the top of this file (2026-09-18) ran 28 grok
      # streams on a 28,746-char draft with 900s budgets, so no silence was cut
      # off by a budget. Nine ran past the stock 120s default before any output
      # and every one of them then completed — slow, not dead. The worst was
      # 354.1s on argument_integrity, with red_team at 348.1s and fact_check at
      # 303.9s; voice_style and completeness never passed 76s. Under the default
      # all nine would have been killed.
      #
      # 500 and not 360-something, for two reasons. The measurement ran grok
      # alone with at most 5 calls in flight, and these silences track fan-out,
      # which this tier and `maximum` take further. And it is the same value,
      # reached the same way, as the sonar-reasoning-pro entry this tier
      # carried for perplexity until 2026-09-28, whose worst observed silence
      # was the same ~354s. It still leaves room for the one
      # retry: the slowest healthy grok call measured 447.1s end to end, so a
      # stall at 500 plus the 10s retry delay plus a full retry is ~957s, inside
      # the 1085s wall-clock backstop grok gets at task_timeout_seconds: 1100.
      #
      # stream_gap_timeout is deliberately NOT set: once grok starts emitting it
      # does not pause — the worst inter-chunk gap over all 28 streams was 0.4s.
      # `balanced` runs grok at effort low, which was not measured, so it keeps
      # the default as well.
      stream_read_timeout: 500
    claude:
      model: claude-sonnet-5   # was claude-opus-5 until 2026-09-08 — see note below
      effort: high

# claude-opus-5 -> claude-sonnet-5 swap, MEASURED 2026-09-08 on a 19,457-word real
# article (dc-environment-v26), 3 isolated runs per condition, cross-run reproducibility
# scored with reproducibility.py against `wide` and `maximum` as anchors:
#
#             cost (avg)   overall repro%   fact-check repro%
#   wide        $0.38          6.8%              0.0%
#   thorough+sonnet-5  $1.74   16.9%             22.1%
#   thorough (opus-5)  $2.64   [not repro-scored; single run only]
#   maximum     $10.27 †      20.0%             29.6%
#
# † $10.27 was priced at a stale gpt-5.6-sol rate, corrected 2026-09-17. This
#   average has not been re-derived, but a later single `maximum` run on the same
#   draft comes to about $9.6 at current rates, which makes the multiple below
#   about 25x rather than 27x. Only `maximum` runs sol -- `thorough`/`balanced`
#   run terra, `wide` runs luna -- so the other three rows are unaffected and the
#   comparison this table was built for still holds.
#
# The sonnet-5 swap captures 84% of `maximum`'s overall reproducibility and 75% of
# its fact-check reproducibility at 17% of the cost -- a far better marginal trade
# than `maximum` itself represents over `wide` (which buys +13.2 points of repro at
# about 25x cost, see † above, vs this swap's +10.1 points at 4.6x cost). Stock
# opus-5 `thorough` was scouted at n=1 ($2.64, no clear edge over the sonnet-5
# swap's findings) and was not taken to a full 3-run study once the swap's numbers
# came back this strong -- see pipeline_history and the session that ran this for
# the n=1 comparison.
#
# `balanced` was measured in the same round and is NOT a good value: 6.4% overall
# repro, statistically indistinguishable from `wide`'s 6.8%, at 3.4x the cost. It
# has not been retired or changed here -- that is a separate decision -- and its
# "← default" status in configs/user.example.yaml has already been moved to `wide`
# because of this finding.
#
# claude-fable-5.1 was considered and CLOSED, 2026-09-09, without a live test.
# Pricing (litellm's cost map, sourced from Anthropic's own docs): $10/$50 per
# MTok in/out, thinking_always_on (cannot be dialed down the way opus-5/sonnet-5
# can) -- 2x opus-5's price, 5x sonnet-5's. Anthropic positions Fable for
# long-horizon agentic work (coding, unattended agent runs, research), explicitly
# recommending sonnet-5/opus-5 for chat and drafting instead; a published
# head-to-head found opus-5 already wins the closest analogous category
# ("knowledge-work" Elo) at half Fable's price. Chained with this file's own
# finding that opus-5 wasn't the best value pick for this task, Fable starts from
# a worse position than a model already shown to lose here -- not worth a
# scouting run.
#
# Full research writeup -- methodology, the historical cost-drift check, vendor/
# system currency audit, and the recommended revision-cycle practice this implies
# -- is in PLAN.md §5.6, not just this comment.

maximum:
  thoroughness: maximum
  models:
    openai:
      model: gpt-5.6-sol   # was gpt-5.5; matching price tier, 2026-08-18 refresh
      reasoning_effort: xhigh
      # No stream_read_timeout override — and note that first-byte is NOT this
      # tier's openai problem. The note above ("live-verified against xhigh,
      # reasoning.summary deltas keep the socket active well inside the 120s
      # default") was verified on gpt-5.5 with 2 calls and does NOT hold for
      # gpt-5.6-sol under full fan-out: on 2026-09-09 four sol calls died
      # "stream stalled MID-STREAM: nothing received for 120.0s" at 355.87s,
      # 358.90s, 399.74s and 531.59s elapsed.
      #
      # Mid-stream is stream_gap_timeout (120 for openai, set in client.py's
      # provider table), NOT this knob. Raising stream_read_timeout would not
      # have saved one of them. No value is set here because the correct one is
      # not known — see the CONCURRENCY note at the top of this file. What is
      # known is that the same run completed a sol call that ran 796.93s and
      # emitted 42,016 tokens, so these are not slow-but-alive calls hitting a
      # wall-clock limit; the wall-clock budget (1085s) was never the binding
      # constraint on any of them.
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-pro + thinking_budget 16000; see the Gemini refresh note above
      thinking_level: high   # the deepest it goes, which is what the 16000 budget asked of 2.5 Pro
      # 3.5 Flash has been GA on Vertex AI since 2026-05-19 and is listed to retire
      # "May 19, 2027 or later" (Google Cloud's lifecycle page, read 2026-09-19).
      # The older note here, that gemini-3.x returns 404 on Vertex, was a fact about
      # the location (us-central1), not about the models: they are served at
      # `global` and the `us` and `eu` multi-regions. gemini-3.8-flash is the newer
      # line, half the price until 2026-12-31, with no retirement date announced. It
      # was measured at `high` on 2026-09-27 (table above) and not adopted: 89 queries,
      # 259s, and two attempts that returned malformed JSON, both billed.
      stream_read_timeout: 260   # From the 2.5 Pro setting. grounding (160s default) + a long
                                  # thinking phase stacks extra silent time on top of search
                                  # latency; 2.5 Pro timed out at 205.78s on a maximum-preset
                                  # Vertex AI call (completeness domain, 73786 chars). Measured
                                  # for 3.5 Flash at `high` on 2026-09-27, all five domains of
                                  # a 9,456-char draft: worst first byte 24s, worst gap 0.9s
                                  # (the thought summaries stream), longest call 135s, so 260
                                  # has room there. A long draft is unmeasured.
    mistral:
      model: mistral-medium-3-5
      reasoning_effort: high
      stream_read_timeout: 200   # not migrated — see the Mistral note above
    perplexity:
      model: perplexity/sonar   # was sonar-reasoning-pro; see the Perplexity refresh note above
      # No stream_read_timeout override; see the thorough tier's note.
    grok:
      model: grok-4.6   # was grok-4.20-0309-reasoning; see the Grok note above
      reasoning_effort: high   # what unset already resolved to; stated so the
                               # tier says what it does. xhigh exists and is
                               # unmeasured, so it is not reached for here.
      stream_read_timeout: 500   # the same measurement as the thorough tier's
                                  # grok entry above, which carries the numbers.
                                  # This tier fans out furthest — 29 calls — and
                                  # fan-out is the axis those silences track, so
                                  # if either tier needs it, this one does.
      # xAI Live Search is real and works — asked for the newest litellm release
      # on PyPI, grok said "I do not know" without it and answered with a cited
      # version with it. NOT enabled here because litellm cannot currently send
      # it alongside a system prompt: with web_search_options set, it converts
      # the system message into an `instructions` field and then rejects that as
      # unsupported for XAI. Every review prompt is a system prompt, so the
      # combination is unusable until that is fixed. Filed upstream; see
      # UPSTREAM.md. Flip this on once litellm ships the fix.
    claude:
      model: claude-opus-5   # was claude-opus-4-8; 2026-08-18 refresh, same price
      effort: high
      web_search: [fact_check]   # Same check, same result. fact_check had two
                                  # grounded models out of six; this makes four.
                                  # Scoped to fact_check because every search
                                  # bills and no other domain benefits.

# Unrecognised top-level keys are an error, so a typo cannot silently read as
# an absent setting. If you need a key that is deliberately not this
# pipeline's -- a note, or a value some other tool reads out of this file --
# prefix it with x_ and it is ignored without complaint.
publication_name: your_publication_name

# Optional. Who "I" refers to in your drafts, by name. Citation verification
# needs it to check a first-person claim against a source page: told nothing,
# the verifier binds "I" to whoever it finds on the page; told only not to
# guess, it reports a page that does name you as not addressing the claim.
#
# Set it here once for a single-author publication. A guest or co-authored
# piece overrides it per article with the handoff's "Author:" line, which
# wins when both are present. This default is the only source for --raw-draft
# and --url, which carry no handoff metadata at all.
author_name: Your Name

publication_description: |
  One paragraph: what the publication covers, who the reader is,
  what it holds itself accountable to, what would make a piece
  unpublishable here regardless of writing quality.

audience:
  primary: |
    Specific description of primary reader: what they know,
    what they want, what baseline knowledge to assume.
  secondary: |
    If applicable.

style_profile: |
  Written description of characteristic style.
  Be specific: what you always do, what you never do,
  intentional deviations from standard style, and
  what would make a sentence obviously not yours.

style_rules:
  banned_words:
    - delve
    - utilize
    - leverage
    - navigate
    - landscape
    - unpack
    - shed light on
  banned_phrases:
    - "it's worth noting"
    - "at the end of the day"
    - "in conclusion"
    - "it could be argued"
  positive_rules:
    - "State conclusions before evidence, not after"
    - "Use specific numbers, not approximations"
    - "Active voice except when passive is demonstrably better"
    - "Short sentences for emphasis"

# Optional — SEO thresholds for the pre-analysis pass. Omit to use the defaults
# shown here. Set these when your publication has different SEO standards.
seo_rules:
  title_max_chars: 60       # search snippets truncate around 60 chars
  title_min_chars: 20
  min_article_words: 300    # below this, the report flags thin content
  meta_description_max_chars: 155   # ceiling for the meta description
  meta_description_min_chars: 70    # below this, search substitutes body text
  # One extra cheap model call per draft run, proposing the whole SEO METADATA
  # block: focus keyword candidates, meta description, OG title, OG
  # description, schema type. Advisory only — nothing is applied
  # automatically.
  suggestions: true
  # A second cheap call judging the article's structure the way a reader
  # arriving from a search result sees it: are the headings descriptive, does
  # the opening deliver, does the article match its title.
  content_review: true
  # --no-seo-suggestions turns off both for a single run.

languagetool:
  auto_apply:
    - TYPOS
    - PUNCTUATION
    - GRAMMAR
  flag_for_review:
    - STYLE
    - TYPOGRAPHY
  suppress:
    - SENTENCE_FRAGMENT

citation_sources:
  - name: EIA
    adapter: eia
    description: Energy Information Administration data
  - name: FRED
    adapter: fred
    description: Federal Reserve Economic Data (BLS, Census series)
  # Available adapters: eia, fred, census, fhwa, crossref, epa, pjm, icc, ferc, ilga
  # Claims from fact-check results are resolved against these sources (Pass 3).
  # Each resolved URL is also checked against the Wayback Machine automatically.

# Custom review domains — publication-specific prompts run in addition to the
# five built-in domains (fact_check, voice_style, completeness, argument_integrity,
# red_team).  Each domain runs on the models you list.  The prompt can be an
# inline string or a path to a .txt file.
#
# custom_domains:
#   brand_compliance:
#     prompt: |
#       Review this article for brand compliance.  Flag any passage that:
#       - Uses competitor names without proper framing
#       - Makes claims that require legal review before publishing
#       - Contradicts messaging in our style guide
#       Return JSON with a "flags" list, each with "passage" and "reason".
#     models: [openai, claude]
#     weight: 1.0
#
#   legal_review:
#     prompt_file: prompts/legal_review.txt
#     models: [claude]
#     weight: 1.2

wordpress:
  site_url: https://yoursite.com
  username: your_wp_username
  application_password: your_app_password
  default_status: draft
  rest_api_endpoint: /wp-json/wp/v2

rank_math:
  default_schema_type: BlogPosting
  # A focus keyword and meta description are never derived and written for
  # you — see seo_rules.suggestions, which proposes both for you to choose
  # from and apply yourself.
  auto_set_og_tags: true
  do_not_touch:
    - cornerstone_content
    - pillar_page

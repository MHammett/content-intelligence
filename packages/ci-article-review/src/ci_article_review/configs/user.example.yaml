# API keys -- copy to user.yaml and fill in; never commit user.yaml
api_keys:
  # Required
  openai:
    api_key: your_key_here
  gemini:
    api_key: your_key_here    # omit when using provider: vertex_ai
  mistral:
    api_key: your_key_here

  # Optional — adds a second search-grounded fact-check pass (recommended)
  perplexity:
    api_key: your_key_here

  # Optional — adds a Grok red team pass when present
  grok:
    api_key: your_key_here

  # Optional — adds a Claude argument integrity pass when present
  claude:
    api_key: your_key_here

  # Optional — set grammar_pass: false in pipeline below to skip entirely.
  # Two ways to configure this adapter — pick one (see docs/PROVIDERS.md):
  #
  # Self-hosted (free, e.g. `docker run -d -p 8010:8010 erikvl87/languagetool`):
  #   server_url: http://localhost:8010/v2/check
  #
  # Hosted API (paid, https://languagetool.org/proofreading-api — NOT the
  # cheap personal "Premium" subscription, which doesn't include this):
  languagetool:
    username: your_email@example.com
    api_key: your_key_here

  # Optional — authenticates Wayback Machine "Save Page Now" submissions for
  # resolved citations that aren't archived yet (get a key pair at
  # https://archive.org/account/s3.php). Without it, submission still works
  # via archive.org's unauthenticated trigger endpoint, just with tighter
  # rate limits.
  archive_org:
    access_key: your_access_key_here
    secret_key: your_secret_key_here


# Model configuration — two forms are accepted:
#
#   Simple form (default):
#     Specify a model name as a plain string.  Uses the provider's public API
#     with your API key above.  This is the right starting point.
#
#   Extended form (provider switching or per-model flags):
#     Specify a dict with provider, model, and any provider-specific fields.
#     Use this to switch to a reserved-capacity tier (Vertex AI, Azure OpenAI),
#     enable web search, restrict which prompts a model runs, or disable a
#     model without removing its API key.  Simple-form entries are unaffected —
#     you can mix forms.
#
# Current model IDs (September 2026):
#   OpenAI:      gpt-5.6-sol ($4/$20 /MTok, promotional through at least 2026-11-21), gpt-5.6-terra ($2/$12), gpt-5.6-luna ($0.20/$1.20)
#              Sol/Terra/Luna replaced 5.5/5.4/5.4-mini on 2026-07-09 at matching tiers;
#              Terra and Luna then got price cuts on 2026-07-30, and Sol is on a promotional
#              rate (all rates above are current).
#   Gemini:      gemini-2.5-pro ($1.25/$10), gemini-2.5-flash ($0.30/$2.50), gemini-2.5-flash-lite ($0.10/$0.40)
#              The 2.5 family is listed for retirement on Vertex AI on 2026-10-20 (Google Cloud's
#              model lifecycle page; dates may be extended but will not move earlier).  The Gemini
#              API listed no shutdown date on 2026-09-19.  Gemini 3.5 Flash ($1.50/$9.00) and the
#              3.6-3.8 Flash models are GA; no preset runs them yet.  See docs/PROVIDERS.md.
#   Mistral:     mistral-large-latest ($0.50/$1.50), mistral-small-latest ($0.15/$0.60)
#              mistral-medium-3-5 ($1.50/$7.50; reasoning_effort "high" or "none" only)
#              A -latest alias moves to each new GA model, and its price moves with it.
#              Note: reasoning_effort is NOT supported on most Mistral models (API rejects it) —
#              mistral-medium-3-5 is the one exception, and litellm needs an explicit
#              allowed_openai_params escape hatch to send it (see ci_core/llm/client.py).
#   Perplexity:  sonar-reasoning-pro, sonar-pro, sonar, sonar-deep-research
#              Sonar chat completions is supported only until 2026-09-27; Perplexity is moving
#              Sonar to its Agent API.  See docs/PROVIDERS.md.
#   Grok:        grok-4.6 ($2/$6), grok-4.3 ($1.25/$2.50, general purpose; what `wide` runs)
#              grok-4.6 and grok-4.5 take reasoning_effort (low/medium/high/xhigh, default high);
#              on the 4.20 generation reasoning is chosen by the "-reasoning" or
#              "-non-reasoning" model name instead.
#   Claude:      claude-opus-5 ($5/$25), claude-sonnet-5 ($2/$10), claude-haiku-4-5-20251001 ($1/$5)
#              opus-5/sonnet-5 replaced opus-4-8/sonnet-4-6 in 2026-06/07; sonnet-5 is
#              cheaper than sonnet-4-6 was ($2/$10 vs $3/$15), opus-5 is the same price.
#
# Simple form (default):
models:
  openai: gpt-5.6-terra
  gemini: gemini-2.5-flash
  mistral: mistral-large-latest
  perplexity: sonar-reasoning-pro
  grok: grok-4.3
  claude: claude-opus-5

# To disable a model without removing its API key, use the extended form:
#
#  grok:
#    enabled: false
#    model: grok-4.3
#
#  claude:
#    enabled: false
#    model: claude-opus-5

# To restrict which prompt domains a model runs (overrides thoroughness preset):
#
#  perplexity:
#    model: sonar-reasoning-pro
#    prompts: [fact_check]   # only run this model for fact-check; skip other domains

# Per-model timeout and reasoning controls (extended form):
#
# TIMEOUTS ARE AUTOMATIC. By default the pipeline sizes each model's timeout from
# the draft length, the model, and the reasoning effort using the sliding-scale
# model in configs/timeouts.yaml — you do NOT need to set timeout_seconds.
# Set timeout_seconds on a model only to OVERRIDE the formula for that model.
#
# OpenAI — reasoning.effort: none | low | medium | high | xhigh
# Supported on gpt-5.x models.  Default is "medium" on all three gpt-5.6 models, and
# leaving it out sends nothing, so it runs at medium; "none" is what turns reasoning off.
#
#  openai:
#    model: gpt-5.6-terra
#    reasoning_effort: medium   # "none" | "low" | "medium" | "high" | "xhigh"
#    timeout_seconds: 300
#
# Claude — thinking mode depends on the model.  This follows Anthropic's per-model table
# (https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting) and
# docs/CONFIGURATION.md, "Claude — adaptive vs extended thinking":
#
#   Adaptive thinking (claude-opus-5, claude-sonnet-5, claude-fable-5, claude-opus-4-8):
#     No thinking_budget — control depth via the effort parameter.
#     claude-opus-5 and claude-sonnet-5 think even with no effort set, at "high".
#     Anthropic's API accepts thinking: disabled on these two, but this pipeline never
#     sends it, so it cannot turn their thinking off.
#     claude-fable-5 is always on and cannot be turned off.
#     claude-opus-4-8 does not think unless an effort is set.
#     There is no effort "none": it does NOT turn thinking off.  litellm drops it,
#     so Opus 5, Sonnet 5 and Fable still think at "high", and config load warns.
#     To spend less on thinking, use effort: low or medium.
#
#   Extended thinking (claude-haiku-4-5-20251001 and the other 4.5 models — their only
#   mode, off unless you set thinking_budget):
#     Opt-in via thinking_budget.
#     Do NOT use thinking_budget on Opus 5, Sonnet 5, Opus 4.8 or Fable: extended
#     thinking is rejected with a 400 on every Claude 4.7-and-later model, so use
#     effort.  Only Opus 4.6 and Sonnet 4.6 still accept it, and Anthropic has
#     deprecated it there.
#
#   Spell it the way claude reads it.  The key is `effort` (openai, mistral, grok
#   and perplexity take `reasoning_effort`); the other spelling is ignored, so
#   `reasoning_effort` under claude leaves it thinking at its default.  And write
#   the level in lowercase: litellm rejects "High", and every claude call fails.
#   Config load warns of both.
#
#  claude:
#    model: claude-opus-5
#    effort: high               # "low" | "medium" | "high" — adaptive thinking depth
#    timeout_seconds: 360
#
#  claude:
#    model: claude-sonnet-5
#    effort: medium             # adaptive thinking (recommended); do NOT use thinking_budget
#    timeout_seconds: 360
#
#  claude:
#    model: claude-haiku-4-5-20251001
#    thinking_budget: 5000      # extended thinking — the only mode this model has
#    timeout_seconds: 360
#
# Gemini — thinking token budget.  This is the control for the 2.5 models (Gemini 3.x uses
# thinking_level instead, which the pipeline does not send).  2.5 Flash takes 1-24,576
# tokens, 2.5 Flash-Lite 512-24,576, 2.5 Pro 128-32,768; unset, each thinks dynamically.
#  gemini:
#    model: gemini-2.5-flash
#    thinking_budget: 8192      # 0 = disable thinking, on the Flash models only —
#                               # thinking cannot be turned off on gemini-2.5-pro;
#                               # omit = dynamic default
#    timeout_seconds: 180
#
# Grok — grok-4.6 and grok-4.5 take a real reasoning_effort (low/medium/high/xhigh,
# default high, so leaving it out buys the most expensive setting); the 4.20 generation
# selected reasoning via a separate model name instead.  Verified 2026-09-05 that litellm
# forwards it to xAI unchanged (see the Grok note in configs/presets.yaml).
#  grok:
#    model: grok-4.6
#    reasoning_effort: low       # low | medium | high | xhigh
#
# Mistral — only mistral-medium-3-5 supports reasoning_effort, and only "high"/"none".
# (magistral-medium-latest is deprecated; mistral-medium-3-5-latest does not exist.)
#  mistral:
#    model: mistral-medium-3-5
#    reasoning_effort: high            # "high" or "none" only — "low"/"medium" error


# Extended form examples — replace the simple entries above with these to
# switch providers.  Delete or comment out the simple entry for the same key.
#
# Vertex AI (Gemini) — eliminates AI Studio capacity 503s.
# Requires: pip install google-auth
# Auth: set credentials_file to a service-account JSON, or omit to use
#        Application Default Credentials (gcloud auth application-default login).
#
#  gemini:
#    provider: vertex_ai
#    model: gemini-2.5-flash
#    project: my-gcp-project        # GCP project ID
#    location: us-central1          # Vertex AI region
#    # credentials_file: C:\Users\you\keys\my-project.json   # omit = ADC
#
# OpenAI with live web search (OpenAI Responses API):
#
#  openai:
#    model: gpt-5.6-terra
#    web_search: [fact_check]   # only these domains search; `true` means all five
#                               # (search bills per search, and only fact_check
#                               #  has any use for a live-fetched source)
#
# Azure OpenAI — data residency, SOC2, provisioned throughput.
# The api_key above should be your Azure resource key (not an OpenAI key).
# Wire-verified only: never yet run against a live Azure resource, so run
# ci-check first. docs/CONFIGURATION.md has the details.
#
#  openai:
#    provider: azure
#    model: gpt-5.6-terra           # what the deployment serves; prices the call,
#                                   # and no cost preset changes it
#    endpoint: https://my-resource.openai.azure.com
#    deployment: my-gpt5-deployment # what actually runs
#    # api_version: 2025-04-01-preview  # optional; defaults to preview. Nothing
#                                       # older than 2025-03-01-preview works.
#
# Azure AI (Mistral) — same key format as La Plateforme, and wire-verified only
# too. Store your Azure endpoint key in api_keys.mistral.api_key above.
#
#  mistral:
#    provider: azure
#    model: mistral-large-latest    # the name the endpoint is called with
#    endpoint: https://Mistral-Large-abc.eastus2.inference.ai.azure.com
#    # api_version: 2024-05-01-preview  # a Foundry endpoint needs one


# Pipeline behavior
pipeline:
  grammar_pass: true            # set false to skip LanguageTool entirely
  parallel_review_calls: true

  # Which model you draft with, if you draft with one. That model is excluded
  # from voice_style, because ai_speak.txt asks the reviewer to flag the exact
  # phrasing habits that are its own defaults, and it under-reports them.
  # A `Drafted with:` line in the handoff overrides this for a single article.
  # drafting_model: claude

  # Move the per-domain instruction after the article so all of a provider's
  # calls in a run share a byte-identical prefix and calls 2+ hit the prompt
  # cache. Measured 76% of input cached on calls 2+, worth roughly $0.56-1.01
  # per run. A four-run live A/B (two off, two on) found no detectable effect
  # on review quality -- see docs/CONFIGURATION.md. Left off here because the
  # same test found a single run only ~25% reproducible regardless of this
  # setting, which makes the saving not worth the config surface for this
  # project; may be worth enabling if you run at higher volume or already
  # aggregate multiple runs per article.
  # prompt_cache_layout: false


  retry_on_failure: true
  retry_delay_seconds: 10

  # After the main ensemble batch, re-attempt calls still marked failed —
  # a provider stream stall or a malformed-JSON response that also failed its
  # one retry, not a config problem. recovery_delay_seconds is deliberately
  # longer than retry_delay_seconds: it's a "give the provider a breather"
  # pause between whole passes, not the per-call backoff above. Set
  # recovery_passes: 0 to disable. Skips calls whose error looks permanent
  # (bad key, archived account, quota exhausted) rather than retrying a dead
  # account identically every pass.
  recovery_passes: 1
  recovery_delay_seconds: 30

  abort_if_all_provider_calls_fail: false
  task_timeout_seconds: 1100   # absolute ceiling for the sliding-scale timeout model
                                # (configs/timeouts.yaml); per-model timeouts clamp to this − 15

  # Newer-model check.  The run report always reads the model-discovery cache
  # that `uv run ci-discover` writes, so running that command occasionally is
  # enough to have the report name any model newer than the one a run used.
  #
  # Setting this true additionally lets the run itself refresh that cache when
  # it is older than live_model_check_max_age_hours — one models-list request
  # per provider, at most once per window.  Off by default because it is the
  # only part that adds latency and a network dependency to a run.
  #
  # Advisory either way: a provider that cannot be reached is reported as
  # unchecked rather than as "up to date", and nothing here can fail a run.
  # --offline never queries regardless of this setting.
  # live_model_check: true
  # live_model_check_max_age_hours: 24

  # Link / archive checks
  link_validation: true             # check HTTP status of every URL in the draft
  wayback_link_check: true          # also query the Wayback Machine for each URL
  wayback_snapshot_stale_days: 180  # snapshots older than this are flagged [STALE]

  # Optional Save Page Now capture options, passed straight through to
  # archive.org when this run submits a citation for archiving. Every one is
  # off unless set here — these are archive.org's own documented SPN2 options,
  # not settings this pipeline invents, and the defaults are archive.org's.
  #
  # An unknown key, a wrong type, or a js_behavior_timeout outside 0-30 is
  # ignored with a warning in the run log rather than failing the review.
  #
  # wayback_capture:
  #   js_behavior_timeout: 5       # seconds (0-30) archive.org lets a page's JS
  #                                # settle before capturing. Raise it for a
  #                                # source that renders its content client-side
  #                                # and archives as an empty shell.
  #   skip_first_archive: true     # skip archive.org's check for whether this is
  #                                # the URL's first-ever capture. Slightly
  #                                # faster; no effect on what gets captured.
  #   outlinks_availability: false # also report whether the page's outbound
  #                                # links are archived. Costs capture time and
  #                                # nothing in this pipeline reads it yet.
  #   capture_screenshot: false    # also save a PNG of the page. Citation review
  #                                # verifies text, so this buys a slower capture
  #                                # and a URL nothing here checks.
  #   delay_wb_availability: false # do NOT enable while archive_match
  #                                # verification is on: it hides the new
  #                                # snapshot from the Wayback Machine for ~12h,
  #                                # and this run reads the snapshot back to
  #                                # checksum it against the live page. The
  #                                # verification would report "could not read
  #                                # the snapshot" for every URL archived today.
  #   use_user_agent: ""           # what archive.org's capture bot presents to
  #                                # the source site. Some publishers serve a bot
  #                                # wall to the default and a real page to a
  #                                # named crawler.
  #
  # The three capture options that carry a secret — target_username,
  # target_password and capture_cookie, for a page behind a login form — are
  # credentials, so they go under credentials.archive_org alongside the S3 key
  # pair, never here. Worth thinking about before using them: a source that
  # needs a login to read is one your readers cannot verify, and archiving it
  # produces a snapshot nobody else can reach.

  # Cost preset — sets model variants, reasoning flags, and thoroughness as a bundle.
  # When set, the preset overrides model names and reasoning flags for all configured
  # providers.  Provider infrastructure settings (vertex_ai, azure, credentials) are
  # preserved, and so is the model name on Azure, where the deployment decides it.
  # Use thoroughness: below to override just that part of the preset.
  #
  # Preset    Thoroughness  Reasoning     Measured cost (draft size in words)
  # --------  ------------  ------------  --------------------------------------------------
  # economy   standard      not set       not measured on a sized draft; costs less than wide
  # wide      thorough      not set       $0.10-$0.15 (~1,400); $0.38 (~19,500)       ← default
  # balanced  thorough      light (low)   $1.28 (~19,500)
  # thorough  thorough      deep          $1.33 (~2,900); $1.74 (~19,500)
  # maximum   maximum       max           $6.15 (~2,900); about $9.6 (~19,500)
  #
  # Each figure is a floor, not a quote: token costs only, and a retried attempt the
  # provider billed without reporting usage is priced at $0.00.  docs/CONFIGURATION.md,
  # "Cost presets", has the run counts and what was measured.
  #
  # `standard` was retired 2026-09-05 in favour of `wide`, which beat it on every
  # measured axis at lower cost (first measured at 55% of it; the saving has since
  # been re-priced smaller, and depends on what is counted -- see
  # configs/presets.yaml); an existing `cost_preset: standard` still runs (as
  # `wide`) and warns rather than erroring.
  #
  # DEFAULT CHANGED 2026-09-08 from `balanced` to `wide`: `balanced`'s measured
  # reproducibility (6.4%) is statistically no better than `wide`'s (6.8%) despite
  # costing 3.4x more. See configs/presets.yaml, the note above the `maximum:`
  # block, for the full comparison across all four tiers.
  #
  # Reasoning presets (balanced+) automatically switch to reasoning-capable models.
  # The exact model/effort per preset lives in configs/presets.yaml; current bundle:
  #   OpenAI  → gpt-5.6-terra low/high (balanced/thorough), gpt-5.6-sol xhigh (maximum)
  #   Mistral → mistral-medium-3-5 (reasoning_effort "high" at thorough+; "high"/"none" only)
  #   Grok    → grok-4.6 with reasoning_effort low/high/high (balanced/thorough/maximum)
  #   Gemini  → gemini-2.5-pro at thorough+ (thinking cannot be turned off on it)
  # economy and wide run gpt-5.6-luna and mistral-small-latest with no effort set, so each
  # provider's own default applies (gpt-5.6-luna reasons at medium, not none).
  #
  # Two models these presets run are on retirement schedules: Perplexity's Sonar chat
  # completions (2026-09-27) and Gemini 2.5 on Vertex AI (2026-10-20).  See docs/PROVIDERS.md.
  #
  # Perplexity and thinking-enabled Claude have higher variance because of their
  # reasoning-trace token overhead.
  #
  cost_preset: wide

  # Preset overrides — selectively adjust individual settings from the preset
  # without rebuilding the full config.  Only keys you list are changed; all
  # other preset settings remain in effect.
  #
  # Rules:
  #   - The override applies AFTER the preset, so preset values are the baseline.
  #   - Only providers already configured in models: are affected.
  #   - Keys not mentioned keep the preset's value.
  #   - Set a key to null to neutralize it (e.g., thinking_budget: null disables
  #     extended thinking even if the preset would have enabled it).
  #   - Infrastructure keys (provider, project, credentials_file, etc.) work here
  #     but are usually already correct from your models: section.
  #
  # Examples:
  #
  # Bump OpenAI reasoning from balanced's "low" to "high":
  #
  #   preset_overrides:
  #     openai:
  #       reasoning_effort: high
  #
  # Use opus instead of balanced's sonnet, at high effort:
  #
  #   preset_overrides:
  #     claude:
  #       model: claude-opus-5
  #       effort: high            # balanced sets medium
  #
  # Disable Grok for this run without changing your models: section:
  #
  #   preset_overrides:
  #     grok:
  #       enabled: false
  #
  # Move Gemini to 3.5 Flash (Google's named replacement for 2.5 Pro on Vertex AI; try it
  # in your own project and location first).  Leave thinking_budget out: the 3.x models
  # use thinking_level, which the pipeline does not send.
  #
  #   preset_overrides:
  #     gemini:
  #       model: gemini-3.5-flash

  # Link validation — check HTTP status of every URL in the article and query
  # the Wayback Machine for each.  Adds a few seconds per article.
  # Set to false to skip entirely.
  link_validation: true
  wayback_link_check: true   # false to skip Wayback checks during link validation

  # Thoroughness — overrides the preset's thoroughness level without changing
  # its model selection or reasoning flags.  Omit to use the preset's default.
  #
  #   standard  — one primary model per domain (lowest cost)
  #               fact_check: gemini
  #               voice_style: openai
  #               completeness: openai
  #               argument_integrity: mistral + claude (if configured)
  #               red_team: mistral + grok (if configured)
  #
  #   thorough  — two or three well-suited models per domain
  #               fact_check: gemini + perplexity (both search-grounded)
  #               voice_style: openai + claude
  #               completeness: openai + mistral
  #               argument_integrity: mistral + claude + openai
  #               red_team: mistral + grok + claude
  #
  #   maximum   — every configured model runs every domain
  #               Domain weights in the ensemble section sort signal from noise.
  #               Best coverage; highest cost (~5x standard).
  #
  # thoroughness: thorough


# Ensemble weighting — controls how much each model's findings count toward
# consensus detection (section 1) and section ordering (sections 2-6).
#
# Weights reflect how well-suited each model is for each domain.  Search-
# grounded models receive a higher weight for fact_check because their claims
# are verifiable against live web sources.
#
# consensus_threshold: weighted sum needed to call a passage consensus.
#   Default 2.0 — two general models (1.0 + 1.0) or one grounding-boosted
#   model (1.5) plus any other (≥0.5) triggers consensus.
#
# lt_weight: partial vote added when LanguageTool also flagged the same
#   passage.  Default 0.5.
#
# Built-in defaults are shown as comments below.  Override only what you
# want to change; omitted keys use the built-in values.
#
# ensemble:
#   consensus_threshold: 2.0
#   lt_weight: 0.5
#
#   # confidence_weights: how much a model's OWN stated confidence damps its
#   # vote. The fact-check prompt asks for high/medium/low on every finding;
#   # by default that value is recorded and displayed but does not affect
#   # weighting, so two models flagging a passage at "low" reach consensus
#   # exactly as if both had said "high".
#   #
#   # Uncomment to make hedging count. Values multiply the model's weight, so
#   # they damp a finding without vetoing it — several models agreeing at "low"
#   # can still reach consensus, which is right, because agreement is evidence
#   # even when each model hedged.
#   #
#   # Note self-reported confidence is not calibrated and is not comparable
#   # across providers, and enabling this changes what lands in Section 1.
#   # Re-check your consensus_threshold after turning it on.
#   #
#   # confidence_weights:
#   #   high: 1.0
#   #   medium: 0.75
#   #   low: 0.5
#   weights:
#     gemini:
#       default: 1.0
#       fact_check: 1.5       # boosted: search-grounded
#     perplexity:
#       default: 1.0
#       fact_check: 1.5       # boosted: search-first model
#     openai:
#       default: 1.0
#       voice_style: 1.2      # well-calibrated for AI-speak and style
#       completeness: 1.2
#     mistral:
#       default: 1.0
#       argument_integrity: 1.2
#       red_team: 1.1
#     grok:
#       default: 1.0
#       red_team: 1.2         # direct, contrarian training useful for attacks
#     claude:
#       default: 1.0
#       argument_integrity: 1.3
#       voice_style: 1.1


# Delta assessment thresholds for re-run recommendation
delta:
  word_change_threshold_pct: 15
  claim_change_triggers_rerun: true
  structure_change_triggers_rerun: true

[project]
name = "ci-article-review"
version = "0.1.0"
description = "Article review pipeline"
requires-python = ">=3.10"
dependencies = [
    "ci-core",
    # The archive.org/SPN2 client (adapters/citation/wayback.py's engine)
    # extracted to its own package so doc-crawler and rochelle-vendor-audit
    # (unrelated projects independently re-implementing the same submit/check
    # logic) can depend on it too, instead of each maintaining a copy.
    "spn-client>=0.1.0,<0.2",
    "requests>=2.31.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
# Vertex AI provider for the Gemini adapter (google.auth token flow).
# Not needed when using Gemini via AI Studio (API-key auth).
vertex = ["google-auth>=2.0"]
# Retained for back-compat: trafilatura is now a required ci-core dependency
# (citation verification depends on extraction quality), so this extra is
# already satisfied by a plain install.
url = ["trafilatura>=1.6"]
# Convenience: all optional extras at once.
all = ["google-auth>=2.0", "trafilatura>=1.6"]

[project.scripts]
ci-setup = "ci_article_review.setup:main"
ci-check = "ci_article_review.check:main"
ci-discover = "ci_article_review.discover:main"
# probe.py had no entry point at all, so the tool for checking that preset
# models still answer — before paying for a full run — could not be run.
ci-probe = "ci_article_review.probe:main"
ci-review = "ci_article_review.pipeline:cli"
ci-history-report = "ci_article_review.history_analytics:main"
ci-voice-patterns = "ci_article_review.voice_pattern_report:main"
ci-markers = "ci_article_review.markers:main"

[tool.uv.sources]
ci-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_article_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Duplicated from the root pyproject.toml, which is the inifile for the
# repo-wide `pytest packages/` run. This one is what pytest reads when the
# package's own tests are run directly.
markers = [
    "slow: inherently wall-clock-bound; deselect with -m 'not slow'",
]
# Duplicated from the root pyproject.toml for the same reason the markers
# above are: the root file is the inifile only for the repo-wide
# `pytest packages/` run, and this one is what pytest reads when this
# package's tests are run directly or a single file is passed. Without it
# the socket guard silently does not apply to exactly the invocation a
# developer iterating on one file uses.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/ci_article_review/check.py" = ["E402"]
"src/ci_article_review/discover.py" = ["E402"]
"src/ci_article_review/pipeline.py" = ["E402"]

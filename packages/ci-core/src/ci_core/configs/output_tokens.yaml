# Output-token ceiling model — the `max_tokens` a capped review pass is sent.
#
#   max_tokens = reasoning_tokens[effort]
#              + max(answer_tokens[domain] × size_mult(draft chars),
#                    answer_tokens_per_char[domain] × draft chars)
#
# with the answer term never below `answer_floor_tokens`, the whole clamped to
# the model's own output limit AND to what its context window leaves after the
# prompt. `size_mult` is NOT defined here: it is timeouts.yaml's size_multipliers
# table, read from there, so the ceiling and the wall-clock budget scale with
# the draft in lockstep and cannot drift apart.
#
# WHO THIS APPLIES TO. Only claude and mistral send a ceiling at all — openai
# (Responses API), grok, gemini and perplexity send none and run to the model's
# own limit (audited 2026-10-24 against litellm's map and the vendors' pages:
# gpt-6.x 128,000; gemini-3.5-flash 65,536; grok-4.x "no text output limit";
# sonar undocumented). Both capped providers get a ceiling on EVERY pass:
#   * a reasoning pass (an `effort` / `reasoning_effort` other than "none", or a
#     claude model that thinks with none set — claude-opus-5, claude-sonnet-5
#     run at `high`, the API default; see _EFFORT_WHEN_UNSET in
#     ci_core/llm/output_tokens.py) gets reasoning_tokens plus the answer term;
#   * a no-effort pass gets the answer term alone. Until 2026-10-24 these kept
#     client.py's flat 8000, and that cut claude-haiku-4-5:argument_integrity
#     at exactly 8000 tokens twice at `wide` (2026-09-28 and 2026-10-04, a
#     9,456-char draft, 38,021 chars of flags written and the rest lost). On a
#     claude model with a `thinking_budget`, the budget stands in for the
#     reasoning term, as the client's own default did.
# An explicit `max_tokens` in a model config always wins over this.
#
# WHY THE FORMULA HAS TWO TERMS. Measured 2026-09-18 across every captured run on
# this machine (1,144 ensemble calls). Before this file existed the ceiling was a
# flat 16000, and it was being hit by REASONING, not by findings:
#
#   pass                          draft   output  visible JSON  so reasoning was
#   mistral:argument_integrity   27,113   16,000   ~1,900 tok     ~14,000
#   mistral:fact_check            2,182   16,000   ~1,900 tok     ~14,100
#   mistral:fact_check            4,121   16,000   ~1,400 tok     ~14,600
#   mistral:fact_check           27,113   16,000   ~4,000 tok     ~12,000
#   claude:fact_check [grounded] 27,113   20,215   ~5,000 tok     ~15,200
#
# (visible = raw JSON chars / 3.6.) Two of those drafts are under 5,000 chars:
# reasoning does not shrink with the draft, so it is a flat term. What the pass
# WRITES does grow with the draft — fact_check emits one entry per claim, and its
# visible answer ran 1,600 tokens on a 2,182-char draft and 5,000-8,000 on
# 18-27k — so that term scales. A single size-scaled number would have starved
# the small drafts, which truncated just as reliably as the large ones.
#
# Both reasoning figures above are FLOORS: those calls were cut off, so they
# report the ceiling rather than what the model wanted. Same trap timeouts.yaml
# describes for timed-out calls — "measure it, do not nudge it". `--no-timeout`
# now lifts this ceiling as well as the wall clock, so a calibration run records
# the uncensored length.

# By effort. A ceiling, not a target: the model is never told it, so raising it
# changes nothing about a call that finishes on its own — it only moves where a
# long one is cut off, and bills only the tokens actually generated.
reasoning_tokens:
  # MEASURED at high. ~2x the largest reasoning count seen on the current
  # prompts (15,200 claude-opus-5, 14,600 mistral-medium-3-5, both still
  # censored), and it alone covers the largest uncapped mistral fact_check
  # ever recorded (30,740 total output, 2026-08-11, before any ceiling existed).
  high: 32000
  # UNMEASURED — no preset runs claude above high. 2x high, a smaller step
  # than timeouts.yaml's 3x wall-clock ratio for xhigh because Anthropic's
  # own output limit (128,000 on opus-5) caps the table long before that
  # matters. Measure with --no-timeout before relying on either.
  xhigh: 64000
  max: 64000
  # low and medium: the flat ceiling every claude effort level was sent before
  # this file, which nothing at those levels has truncated against.
  default: 16000

# The visible JSON the domain returns, in tokens, at timeouts.yaml's 1.0 size
# bucket (50-80k chars). Scaled by that same table, so 0.7x under 5k chars and
# 1.4x at 80-150k — up to the point where the per-character term below is
# larger, which it is from about 90,000 chars on for fact_check.
answer_tokens:
  # MEASURED: largest visible fact_check answer on record at or under the
  # anchor is ~9,200 tokens (gpt-5.6-sol, 33,026 chars of JSON on the
  # 18,167-char draft — the 0.8 bucket; mistral's 29,021 chars on the same
  # draft is the one 2026-09-18 sized from, as 8,061). 16,000 at the anchor is
  # 12,800 at that bucket, 1.4x the measurement, and keeps fact_check above
  # the flag domains' 15,000 at every size: it is the domain that writes one
  # entry per claim, and the budgets size off the largest ceiling.
  fact_check: 16000
  # Every other domain returns a handful of flags, but a flag carries prose.
  # Largest visible answers on record, re-measured 2026-10-24 over every saved
  # capture (JSON chars / 4): ~10,000 tokens (gpt-5.6-sol voice_style, 40,285
  # chars, 18,167-char draft), ~9,500 CENSORED (claude-haiku-4-5
  # argument_integrity, cut at the 8000 ceiling with 38,021 chars written,
  # 9,456-char draft), ~8,500 (claude-opus-5 argument_integrity, 34,111 chars,
  # 169,940-char draft). Was 5000, from a ~4,300-token high-water mark that the
  # haiku pass passed twice. 15,000 at the anchor is 12,000 at haiku's 0.8
  # bucket, 1.26x the censored figure.
  default: 15000

# The answer term's other shape, for the domain whose output is one entry per
# claim: tokens per character of draft, as a straight line through the origin.
# The size table above tops out at 1.8x while the output keeps growing —
# MEASURED 2026-10-23, `maximum`, a 169,940-char draft (190,170 chars as sent):
#
#   pass                 entries   visible JSON    tokens (chars/4)
#   mistral:fact_check   154 (confirmed only; CUT OFF at 50,000 total)
#                                  109,656 chars   ~27,400 and counting
#   openai:fact_check    147       74,076 chars    ~18,500 (finished)
#   mistral:fact_check    75       47,681 chars    ~11,900 (run 23, same
#                                                   article, finished)
#
# The same model on the same article wrote 2x the entries one run apart, so
# the ceiling has to cover the heavy tail, not the median. Per entry the size
# is steady, 240-720 chars (~70-200 tokens) across every model and draft;
# what grows is the count. 0.25 tokens per character is the run-24 pass
# extrapolated to finishing its remaining six buckets at its own per-entry
# size (~250 entries x 712 chars / 4 ≈ 44,500 tokens on 190,170 chars), and
# gives that pass 79,543 instead of 50,000. Below the crossover the table
# still decides, so nothing under 56,000 chars changes. A ceiling, not a
# target: it bills only what is generated. With the anchor above, the line
# decides from about 90,000 chars (where 16,000 x 1.4 = 22,400 meets 0.25 x
# 89,600) and the table below it, so nothing under that size changes.
#
# Only fact_check has a line; the flag domains do not grow with the claim
# count and keep the table alone.
answer_tokens_per_char:
  fact_check: 0.25

# The answer term never goes below this, so a no-effort pass is never sent
# less than the flat 8000 client.py sent before 2026-10-24 — a 2,000-char
# fact_check would otherwise get 7,000 — and nothing shrinks.
answer_floor_tokens: 8000

# Throughput used to turn a ceiling back into seconds: output tokens per second
# over the WHOLE call (first byte and any search included), a little under the
# slowest healthy call measured since the 2026-08-18 migration to litellm, with
# calls that carried a discarded (stalled, retried) attempt excluded — their
# elapsed time includes a dead attempt and says nothing about generation speed.
#
#   claude-opus-5 high           min 56.4 (grounded) / 60.3, median 68.9-72.4
#   claude-haiku-4-5             min 54.7, median 72.9
#   mistral-medium-3-5 high      min 54.0, p10 124.4, median 165.7
#
# Used by timeout_model.compute_all: a capped model's wall-clock budget is
# raised, if it has to be, to the time a healthy call needs to reach its
# ceiling. Without that, raising the ceiling turns a truncation — which keeps
# every complete finding — into a timeout, which keeps none. Prefix match,
# longest key first.
floor_tokens_per_second:
  claude: 50
  mistral: 50
  default: 40

newer_available:
  # 2026-08-18: the previous entries here (gpt-5.4 -> gpt-5.5, claude-sonnet-4-6 ->
  # claude-opus-4-8) were removed rather than updated in place — both source models
  # are now fully superseded (see above) and no preset tier configures them anymore,
  # so they no longer belong in "still in use with an upgrade path".
  gpt-5.6-luna:
    newer: gpt-5.6-terra
    note: "gpt-5.6-terra ($2.00/$12.00 MTok) available for heavier tasks; luna remains the right choice for fast/cheap everyday work"
  claude-haiku-4-5-20251001:
    newer: claude-sonnet-5
    note: "claude-sonnet-5 ($2.00/$10.00 MTok) available; haiku remains better value for economy/standard presets"

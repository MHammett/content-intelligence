    note: "GPT-5.6 family available (2026-07-09)"
  gpt-4-turbo-preview:
    replacement: gpt-5.6-terra
  gpt-4o:
    replacement: gpt-5.6-terra
    note: "GPT-5.6 family available (2026-07-09)"
  gpt-4o-mini:
    replacement: gpt-5.6-luna
    note: "GPT-5.6 family available (2026-07-09)"
  gpt-3.5-turbo:
    replacement: gpt-5.6-luna
  o3:
    replacement: gpt-5.6-sol
    note: "gpt-5.6-sol with reasoning_effort: xhigh supersedes o3 at maximum preset"
  o4-mini:
    replacement: gpt-5.6-terra
    note: "gpt-5.6-terra with reasoning_effort supersedes o4-mini at balanced/thorough presets"
  gpt-5.5:
    replacement: gpt-5.6-sol
    note: "gpt-5.6 family launched 2026-07-09 at matching price tiers"
  gpt-5.4:
    replacement: gpt-5.6-terra
    note: "gpt-5.6 family launched 2026-07-09 at matching price tiers"
  gpt-5.4-mini:
    replacement: gpt-5.6-luna
    note: "gpt-5.6 family launched 2026-07-09 at matching price tiers"

  # Google Gemini. The 2.5 models are listed to retire on Vertex AI on 2026-10-20
  # (Google Cloud's "Model versions and lifecycle" page, read 2026-09-19), with 3.5
  # Flash named as 2.5 Pro's replacement and 3.5 Flash-Lite as 2.5 Flash's. The
  # Gemini API lists no shutdown date for them. 3.1 Flash-Lite is not offered as a
  # replacement: the Gemini API already lists its shutdown, 2027-05-07, with 3.5
  # Flash-Lite as the replacement.
  gemini-2.5-pro:
    replacement: gemini-3.5-flash
    note: "retires on Vertex AI 2026-10-20 (the Gemini API lists no date); Gemini 3 thinks by thinking_level, not thinking_budget"
  gemini-2.5-flash:
    replacement: gemini-3.5-flash-lite
    note: "retires on Vertex AI 2026-10-20 (the Gemini API lists no date)"
  gemini-2.5-flash-lite:
    replacement: gemini-3.5-flash-lite
    note: "retires on Vertex AI 2026-10-20 (the Gemini API lists no date)"
  gemini-pro:
    replacement: gemini-3.5-flash-lite
  gemini-1.0-pro:
    replacement: gemini-3.5-flash-lite
  gemini-1.5-flash:
    replacement: gemini-3.5-flash-lite
  gemini-1.5-flash-latest:
    replacement: gemini-3.5-flash-lite
  gemini-1.5-pro:
    replacement: gemini-3.5-flash
  gemini-1.5-pro-latest:
    replacement: gemini-3.5-flash
  gemini-2.0-flash:
    replacement: gemini-3.5-flash-lite
  gemini-2.0-flash-exp:
    replacement: gemini-3.5-flash-lite
  gemini-2.0-flash-thinking-exp:
    replacement: gemini-3.5-flash-lite

  # xAI Grok
  grok-beta:
    replacement: grok-4.6
    note: "Grok 4.6 available (2026-08-12)"
  grok-2-latest:
    replacement: grok-4.6
  grok-3-latest:
    replacement: grok-4.6
    note: "Grok 4.6 available (2026-08-12)"
  grok-3-mini-latest:
    replacement: grok-build-0.1
  grok-4.20-0309-reasoning:
    replacement: grok-4.6
    note: "grok-4.6 (2026-08-12) has a real reasoning_effort parameter; no longer needs a separate -reasoning model variant"

# Model currency registry — last verified June 2026.
#
# Bump registry_date whenever you review this file against live provider docs.
# The staleness thresholds trigger notices in the pipeline report:
#   stale_notice_days:  soft notice  ("verify when convenient")
#   stale_warning_days: loud warning ("review now")
#
# superseded:  models that have a clearly superior replacement — pipeline warns.
# newer_available: models in use that have a soft upgrade — pipeline notes.

registry_date: "2026-08-18"
stale_notice_days: 60
stale_warning_days: 120

superseded:

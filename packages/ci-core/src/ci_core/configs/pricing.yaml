# Model pricing — per-million tokens: [input, output] or [input, output, cached_input].
# Search and grounding fees, billed on top of tokens, are the second table,
# `search_fees:`, at the end of this file.
#
# The optional third element is the rate for input served from the provider's
# prompt cache. Without it, cached tokens are billed at the full input rate,
# which over-reports every provider that caches — Grok caches automatically, and
# xAI prices its cached input at $0.20 against $1.25 full on the models used
# here, so the report was overstating the cached portion of those calls more
# than sixfold.
#
# xAI also tiers by prompt size: a request whose prompt reaches 200k tokens is
# billed at exactly double these rates for *all* its tokens (grok-4.6: $4.00 in /
# $1.00 cached / $12.00 out, https://docs.x.ai/developers/pricing, re-read
# 2026-09-19). Not modelled, and MEASURED not to apply, though by less than this
# note used to say. Across the 87 distinct live runs saved on this machine
# (2026-09-19), grok's largest single prompt is 37,955 tokens, on the 135,514-char
# maximum run: 19% of the threshold. The 8,951 quoted here before was the largest
# on the 18,167-char run alone. A grok prompt is the whole draft plus a few
# thousand tokens of instructions (the 135,514-char run's five grok calls sent
# 36,098 to 37,955), so the earlier "~33k tokens" whole-draft estimate was close,
# and "per-call prompts are far smaller because each domain sends its own slice"
# was wrong.
# Revisit the xAI tier if a draft reaches about five times that size (some
# 700,000 characters). OpenAI has an analogous tier, with its own margin — see
# the note on its block below.
#
# Last verified: OpenAI against developers.openai.com/api/docs/pricing 2026-09-17
# (gpt-5.6 sol/terra/luna — sol's rate CHANGED, see its block below); Anthropic
# against litellm's model_prices_and_context_window.json 2026-08-18 with
# claude-opus-5's [5.00, 25.00] re-confirmed 2026-09-17; xAI against
# docs.x.ai/developers/pricing 2026-09-19 (every grok row; grok-4.6's cached
# rate CHANGED, $0.20 to $0.50 — see its block below); Mistral against
# Mistral's own model cards and pricing page 2026-09-18 (all three rows, and
# all three rates CHANGED — see its block below); Perplexity against
# docs.perplexity.ai/docs/getting-started/pricing 2026-09-19 (all four rows;
# sonar and sonar-pro CHANGED — see its block below). Gemini/older entries
# still June 2026. Update whenever provider pricing changes.
#
# STILL UNVERIFIED. The 2026-09-17 pass checked OpenAI and Claude only, the
# 2026-09-18 passes checked the three Mistral rows only, and the 2026-09-19 pass
# checked Perplexity and xAI. What is left is one family:
#   gemini-*  — whole row June 2026, priced $0.31 of the 2026-09-09 maximum run
# So ~$0.31 of that run's $6.16 rests on unconfirmed rates — 5%. ($6.16 is the
# sol-corrected $6.09 plus the corrections since: +$0.06 for mistral-medium-3-5,
# +$0.005 for mistral-small-latest and +$0.003 for grok-4.6's cached rate; see
# their blocks.)
#
# Prefix matching applies: "gemini-2.5-flash-0520" matches "gemini-2.5-flash".
# Sort longer IDs before shorter ones if two share a prefix.
#
# To add a new model: append a line and bump the date in model_registry.yaml.
#
# Why this table survived the litellm migration
# ---------------------------------------------
# litellm ships its own cost table (`litellm.model_cost`) and the obvious move
# was to drop this file and use it. Checked model by model on 2026-08-14
# (litellm 1.96.2), it disagreed with the rates here on five of the models
# actually run. "here" is this file as of that check; the last column is the
# provider's own page, where checked:
#
#   model                   here          litellm       provider (2026-09-18/19)
#   mistral-large-latest     3.00/ 9.00    0.50/ 1.50    0.50/ 1.50  Large 3, now fixed
#   mistral-medium-3-5       2.00/ 6.00    1.50/ 7.50    1.50/ 7.50  now fixed
#   mistral-small-latest     0.10/ 0.30    0.06/ 0.18    0.15/ 0.60  Small 4, now fixed
#   sonar-pro                1.00/ 8.00    3.00/15.00    3.00/15.00  now fixed
#   sonar                    0.50/ 1.50    1.00/ 1.00    1.00/ 1.00  now fixed
#
# The disagreements run in both directions, so adopting it wholesale would not
# even be uniformly conservative. But the provider column is what counts, and
# on Mistral it sided with litellm twice and with neither source once, and on
# Perplexity it sided with litellm both times. All five rows now carry the
# provider's rate.
#
# Five corrections have gone the other way — this file wrong, litellm right.
# grok-build-0.1 was [0.30, 1.00] here, which matched no published xAI rate;
# litellm said 1.00/2.00 and docs.x.ai agreed, so the 2026-08-15 check fixed
# this file. mistral-medium-3-5 was [2.00, 6.00] and mistral-large-latest
# [3.00, 9.00], neither ever checked against Mistral; litellm had both right and
# Mistral's model cards agreed, so the 2026-09-18 checks fixed them. sonar was
# [0.50, 1.50] and sonar-pro [1.00, 8.00], neither ever checked against
# Perplexity; litellm had both right and Perplexity's pricing page agreed, so
# the 2026-09-19 check fixed them.
#
# mistral-small-latest is the case to remember, because it was wrong in BOTH
# places. litellm's 0.06/0.18 is the rate it lists for mistral-small-3-2-2506
# (Small 3.2); Mistral's alias now points at Small 4, and litellm's entry has
# not caught up. The lesson is not "litellm is unreliable" — it is that a
# second source is worth having, and that the provider's own documentation
# settles it either way.

unknown_price: [2.50, 10.00]   # fallback for unrecognized model IDs (conservative mid-range)

models:
  # ── OpenAI ──────────────────────────────────────────────────────────────────
  # gpt-5.6 (Sol/Terra/Luna) launched 2026-07-09, replacing 5.5/5.4/5.4-mini at
  # matching price points; Terra and Luna then got price cuts on 2026-07-30
  # (20% and 80% respectively). Terra and Luna re-confirmed unchanged 2026-09-17.
  # 5.5/5.4/5.4-mini kept below for any config still pointing at them.
  #
  # SOL IS PROMOTIONAL, AND MAY REVERT. Sol was [5.00, 30.00, 0.50] here — it
  # had simply inherited gpt-5.5's price at launch and was never re-checked
  # after OpenAI cut it. Verified against developers.openai.com/api/docs/pricing
  # 2026-09-17: $4.00 in / $20.00 out / $0.40 cached, which OpenAI describes as
  # "available at least through November 21, 2026". Standard (post-promotion)
  # pricing is the old $5.00/$30.00. Re-check on or before that date: when the
  # promotion lapses, the correct edit is to restore the 5.00/30.00/0.50 row.
  #
  # The stale rate was not cosmetic. Re-costing the 2026-09-09 maximum-preset
  # run (18,167-char draft) against the corrected row moves it from $7.3741 to
  # $6.0884 — sol alone was overstating that run by $1.2857, 17% of its total.
  # Every cost figure this pipeline produced between the price cut and today is
  # high by a similar proportion wherever sol ran.
  gpt-5.6-sol:           [4.00, 20.00,  0.40]    # PROMOTIONAL — see above; reverts to 5.00/30.00/0.50
  gpt-5.6-terra:         [2.00, 12.00,  0.20]    # was 2.50/15.00 pre-cut
  gpt-5.6-luna:          [0.20,  1.20,  0.02]    # was 1.00/6.00 pre-cut
  #
  # OpenAI also tiers by prompt size, the same way xAI does (see the header
  # note): a request whose prompt exceeds 272k tokens is billed at 2x input and
  # 1.5x output for the FULL request. Not modelled, and not currently reached —
  # the largest single OpenAI prompt in the 2026-09-09 run was 126,176 tokens,
  # under half the threshold. Revisit if drafts roughly double.
  #
  # CACHE WRITES ARE UNMODELLED, AND THEY DO APPLY HERE. The third element in
  # each row above is the cache READ rate, which is the only side cost.py knows
  # about. For the gpt-5.6 family specifically, a cache WRITE bills at 1.25x the
  # uncached input rate (models before 5.6 wrote to cache for free), so the
  # first call carrying each reusable prefix is under-reported by 0.25x.
  #
  # Do not assume this repo's "caching is off by default" note (PLAN.md §5
  # decision 2) covers it — that decision is about Anthropic cache_control
  # layout, which is opt-in. OpenAI's cache is AUTOMATIC on prompts over ~1,024
  # tokens and cannot be declined: the 2026-09-09 run shows 38,335 cached prompt
  # tokens on sol that nothing in this repo asked for. Upper bound on the
  # resulting under-report for that run: 38,335 x 0.25 x $4.00/MTok = ~$0.04 —
  # real, but well inside the noise of the $6.09 total. Worth modelling only if
  # the cached share grows a lot; worth knowing before trusting a total to the
  # cent.
  gpt-5.5:               [5.00, 30.00,  0.50]
  gpt-5.4:               [2.50, 15.00,  0.25]
  gpt-5.4-mini:          [0.75,  4.50,  0.075]

  # ── Google Gemini ────────────────────────────────────────────────────────────
  gemini-3.5-flash:         [1.50,  9.00]
  gemini-2.5-pro:           [1.25, 10.00]
  gemini-2.5-flash:         [0.30,  2.50]
  gemini-2.5-flash-lite:    [0.10,  0.40]

  # ── Mistral AI ───────────────────────────────────────────────────────────────
  # mistral-medium-3-5 VERIFIED 2026-09-18: $1.5/M input, $7.5/M output on
  # Mistral's model card,
  # https://docs.mistral.ai/models/model-cards/mistral-medium-3-5-26-04
  # and the same on https://mistral.ai/pricing/api/. litellm 1.96.2's cost map
  # agrees. The row was [2.00, 6.00], an estimate never checked against Mistral.
  #
  # The cached rate is 10% of input, per
  # https://docs.mistral.ai/studio/conversations/advanced/prompt-caching —
  # and Mistral's cache fires for this pipeline unasked: nothing here sends a
  # prompt_cache_key, yet the 2026-09-09 maximum run's mistral-small-latest
  # citation calls reported 12,648 cached tokens, through the
  # prompt_tokens_details.cached_tokens field the client reads. No
  # mistral-medium-3-5 call on record has hit the cache yet — 0 cached tokens
  # across 48 saved runs — so the third element changes no past figure.
  #
  # The old row was not uniformly low: output was $1.50/M under, input $0.50/M
  # over, so a call was under-reported only while its prompt was under 3x its
  # completion. Re-costing the 2026-09-09 runs moves mistral's share of the
  # 18,167-char maximum run from $0.3876 to $0.4482 (+15.6%), taking that run's
  # sol-corrected $6.0884 to $6.1490. On the 135,514-char draft, whose prompts
  # are larger, maximum moves +$0.0181 and thorough -$0.0056. Of the 48 saved
  # runs that billed this model, 45 move up.
  #
  # mistral-small-latest and mistral-large-latest VERIFIED 2026-09-18, on the
  # model cards of the models those aliases point at (each card lists its
  # aliases), and the same on https://mistral.ai/pricing/api/:
  #   mistral-small-latest = mistral-small-2603, Mistral Small 4: $0.15 / $0.60
  #     https://docs.mistral.ai/models/model-cards/mistral-small-4-0-26-03
  #   mistral-large-latest = mistral-large-2512, Mistral Large 3: $0.50 / $1.50
  #     https://docs.mistral.ai/models/model-cards/mistral-large-3-25-12
  # Cached input is 10% of input for both, per the caching page above. The rows
  # were [0.10, 0.30] and [3.00, 9.00], unsourced since 2026-06-23.
  #
  # A -latest row prices whatever its alias points at today. Mistral's
  # lifecycle policy (https://docs.mistral.ai/inference/model-lifecycle) says
  # aliases "automatically switch to newer models once they reach General
  # Availability", and warns that this can change pricing silently. Re-check
  # these two rows whenever Mistral ships a new Small or Large — litellm's
  # stale mistral-small-latest (see the header) is what skipping that looks
  # like. Both cards mark the model GA and date it well before the oldest saved
  # run (2026-06-08): Small 4 2026-03-16, Large 3 2025-12-02. Mistral publishes
  # no alias-switch date, so re-pricing that history at these rates assumes the
  # switch came with GA, as the policy describes.
  #
  # mistral-small-latest runs in every review — citation verification and both
  # SEO passes — and is the mistral ensemble member at wide and economy. The old
  # row was low on input and output alike (only cached input, billed at the full
  # $0.10, erred high), so all 44 saved runs that billed it move up, its own
  # cost by +34.5% to +76.8%. As a share of the run that is under 0.25% at
  # thorough and maximum (the 18,167-char maximum run goes $6.1490 -> $6.1544,
  # the 135,514-char one $9.5764 -> $9.5877) but about 3% at wide, where it is
  # also in the ensemble: the four full-ensemble wide runs on record, all on the
  # 9,456-char smoke test, move +2.8% to +3.2%. It is the one Mistral model
  # whose cache has fired — 141,720 cached prompt tokens across 18 runs — and
  # the third element prices those at $0.015/M rather than $0.15/M; without it
  # the 135,514-char maximum run would move +$0.0184, not +$0.0113.
  #
  # mistral-large-latest is the client default for provider mistral, and the
  # mistral model user.example.yaml ships. ci-style-profile runs user.yaml's
  # models as written — its own presets.yaml names mistral-large-latest in four
  # of five presets, but those overrides do not load today (see
  # bootstrap._load_presets) — and it logs its spend but saves no call log, so
  # none of that history can be re-priced. No ci-review preset runs it now: the
  # retired `standard` preset did, on 2 of its 7 ensemble calls, and a config
  # that names it with no cost_preset still does. 5 saved runs billed it, 4 of
  # them at standard thoroughness; its share of each falls 83%, and the run
  # totals by 25% to 52%. So the 2026-09-05 comparison that retired `standard`
  # — `wide` at 55% of its cost — was priced with `standard` 6x too high on
  # mistral and `wide` too low; the gap is smaller than that.
  mistral-large-latest:     [0.50,  1.50,  0.05]   # verified 2026-09-18 — see above
  mistral-medium-3-5:       [1.50,  7.50,  0.15]   # verified 2026-09-18 — see above
  mistral-small-latest:     [0.15,  0.60,  0.015]  # verified 2026-09-18 — see above

  # ── Perplexity ───────────────────────────────────────────────────────────────
  # VERIFIED 2026-09-19 on Perplexity's own pricing page, "Token Pricing" under
  # Sonar API Pricing, https://docs.perplexity.ai/docs/getting-started/pricing
  # (read as raw Markdown, not through a summariser). litellm 1.96.2's cost map
  # agrees on all four rows:
  #   sonar                $1 in /  $1 out     was [0.50, 1.50]
  #   sonar-pro            $3 in / $15 out     was [1.00, 8.00]
  #   sonar-reasoning-pro  $2 in /  $8 out     unchanged
  #   sonar-deep-research  $2 in /  $8 out     unchanged — see below
  # The two wrong rows were June 2026 estimates that nobody had checked. The page
  # lists no cached-input rate, so no row has a third element. Its per-request
  # fee is the other half of the bill and lives in search_fees, at the end of
  # this file.
  #
  # sonar-deep-research also bills citation tokens ($2/M), reasoning tokens
  # ($3/M) and $5 per 1,000 search queries. A two-element row cannot express the
  # tokens, and cost.py prices only the prompt, completion and cached counts the
  # client reports, so any citation and reasoning tokens are not in the figure.
  # The per-query part is a search_fees row, but its count
  # (usage.num_search_queries) does not survive litellm's stream, so those calls
  # are counted as unmeasured rather than priced. No preset runs it; read a
  # deep-research figure as a floor.
  #
  # Both corrections raise a cost. Re-costing the 87 distinct live runs saved on
  # this machine (cost.calculate over each api_call_log, discarded attempts
  # included) moves 6 of them, none down:
  #   sonar      5 runs, all `wide` on the 9,456-char smoke test, where it is the
  #              one perplexity ensemble call (fact_check) plus citation
  #              re-asks. Its own cost +21.7% to +35.4%, the run +1.3% to +2.7%
  #              (+$0.0015 to +$0.0043). Input doubled and output fell by a
  #              third, so a call rises while its prompt is longer than its
  #              completion; here prompts run 2 to 3 times longer. A bigger
  #              draft widens it: sonar-reasoning-pro's fact_check sent ~36k
  #              prompt tokens on the 135,514-char draft, against ~6k for
  #              sonar's here.
  #   sonar-pro  1 run, a single-call fragment from 2026-09-05 that cost $0.0370
  #              and now costs $0.0761. It is in no preset.
  # Neither row is in the balanced, thorough or maximum preset; those run
  # sonar-reasoning-pro. So the $0.15 the old STILL UNVERIFIED list charged to
  # `sonar-*` on the 2026-09-09 maximum run ($0.1534) was sonar-reasoning-pro's,
  # a row that was right all along; the two wrong rows cost that run nothing.
  #
  # Perplexity's pricing page says Sonar "will be supported until September 27,
  # 2026", the Agent API replacing it. Nothing here changes for that. Keep these
  # rows past the date: saved runs are re-costed through them, and a deleted row
  # would price them at unknown_price instead.
  sonar-reasoning-pro:      [2.00,  8.00]          # verified 2026-09-19, unchanged
  sonar-deep-research:      [2.00,  8.00]          # verified 2026-09-19, unchanged — tokens only, see above
  sonar-pro:                [3.00, 15.00]          # verified 2026-09-19 — see above
  sonar:                    [1.00,  1.00]          # verified 2026-09-19 — see above

  # ── xAI Grok ─────────────────────────────────────────────────────────────────
  # grok-4.6 released 2026-08-12, replacing the 4.20-reasoning variant this
  # pipeline used for CoT. VERIFIED 2026-09-19 at
  # https://docs.x.ai/developers/pricing ("Text API Pricing", read as raw
  # Markdown) for a prompt under 200k tokens: $2.00 in / $0.50 cached / $6.00
  # out. Input and output were confirmed 2026-08-15; the cached rate had been
  # CARRIED FORWARD from the older grok models' $0.20, and is $0.50. Not in
  # litellm 1.96.2's packaged pricing map (checked 2026-09-19), so xAI's page is
  # the only source. The four rows below were re-read the same day and stand.
  #
  # Only cached input moved, so a saved run rises by exactly $0.30 per million
  # cached tokens and never falls. 17 of the 87 saved live runs billed grok-4.6,
  # and every one of them cached some of it: 222,720 tokens in all, +$0.067
  # across the lot. That is +$0.0027 on the 18,167-char maximum run ($6.1544 to
  # $6.1571, +0.04%); +$0.0118 on the 135,514-char one ($9.5877 to $9.5995,
  # +0.12%, nearly all of it one call that cached 37,248 of its 37,354 prompt
  # tokens); and $0.0002 to $0.0013 at thorough, where grok makes a single call.
  # A run made of nothing but grok-4.6 moves +0.6% to +1.4%. grok-4.3, which
  # `wide` runs, is unchanged.
  #
  # grok-4.6 ships a 500k-token context window, so a prompt the model accepts can
  # reach the 200k tier. Not modelled; the header has the measured margin.
  grok-4.6:                     [2.00,  6.00,  0.50]   # verified 2026-09-19 — see above
  grok-4.20-0309-reasoning:     [1.25,  2.50,  0.20]
  grok-4.20-0309-non-reasoning: [1.25,  2.50,  0.20]
  grok-4.3:                     [1.25,  2.50,  0.20]
  # Base rates corrected 2026-08-15: this was [0.30, 1.00], which matched no
  # published xAI rate. docs.x.ai lists $1.00 in / $2.00 out.
  grok-build-0.1:               [1.00,  2.00,  0.20]

  # ── Anthropic Claude ─────────────────────────────────────────────────────────
  # claude-opus-5 and claude-sonnet-5 both confirmed against litellm's pricing
  # map 2026-08-18. Opus-5 is unchanged from opus-4-8's rate; sonnet-5 actually
  # dropped from sonnet-4-6's $3.00/$15.00 to $2.00/$10.00 — do not assume flat
  # carryover pricing on a version bump the way opus's did.
  #
  # Cached-read rates added 2026-09-10, at Anthropic's published 0.1x of base
  # input. Every Claude row was a bare [in, out] pair before, which meant
  # cost.py billed cache reads at the FULL input rate — so turning caching on

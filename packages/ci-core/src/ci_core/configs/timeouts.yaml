# Sliding-scale timeout model — derived from calibration runs on 2026-06-22.
#
#   effective = clamp( base × size_mult × model_mult × effort_mult × variance_margin,  floor,  task_ceiling − 15 )
#
# WHAT THIS SIZES (streaming): the review adapters stream (SSE), so this value is
# the per-task thread WALL-CLOCK BACKSTOP, not the HTTP socket timeout. The socket
# read timeout is a small constant inter-token gap held by the adapters (see
# ci_core/llm/streaming.py and the `stream_read_timeout` per-model override).
# This ceiling still has to cover the genuine TOTAL generation time (streaming does
# not make a long call finish faster); what it no longer absorbs is a hang/stall,
# which the read-gap layer now catches in ~120s.
#
# A per-model timeout_seconds set explicitly in user.yaml OVERRIDES this entirely
# (escape hatch). Otherwise the pipeline computes each model's backstop from the
# draft's character count and the model + reasoning effort.
#
# HOW TO CHANGE A CELL: measure it, do not nudge it. Run with --no-timeout so the
# call runs to completion and its true elapsed time is recorded, then set the cell
# from that number. Every value below that was raised incrementally against a
# ceiling it had just hit has needed raising again — sonar's read-gap went
# 160->280->350->500 and its multiplier 3.0->5.0->7.0, grok 1.2->2.0, mistral
# 1.3->1.7 — because a timed-out call reports the ceiling, not the real duration,
# so the next guess is built on the previous guess. The one cell measured properly
# (gpt-5.5 xhigh, max 456s under --no-timeout) is the one that has stayed put.
#
# CALIBRATION NOTE: the model_multipliers and effort_multipliers are anchored at
# the "≤80000" size bucket (size_mult = 1.0), from one ~62,000-char document.
#
# The 150000 bucket (mult 1.4) HAS now been exercised: a full maximum-preset run on
# a 130,190-char draft (2026-08-12). Budget utilisation, worst call per provider:
#
#   grok        126s budget   126.0s used   100%   ← timed out
#   openai     1085s budget   426.1s used    39%
#   gemini      420s budget   162.1s used    39%
#   mistral     624s budget   138.4s used    22%
#   perplexity  735s budget   138.6s used    19%
#
# The size axis itself held up: doubling the document did NOT double elapsed time,
# because generation is driven by OUTPUT length, and output is bounded by what each
# domain prompt asks for rather than by how much input it read. A sub-linear size
# multiplier is therefore right in principle, and 1.4 is defensible.
#
# What that run exposed is a single miscalibrated CELL, not a broken model: every
# provider but grok finished inside 39% of its budget. See model_multipliers.
#
# Observed at ~74k chars, for reference:
#   grok 16-51s · gpt-5.4 none 20-28 · gpt-5.4 high 107-120
#   mistral-medium-3-5 none 10-31 · high 67-169 · gemini grounded 55-220
# gpt-5.5 xhigh — measured untruncated (--no-timeout), max 456s; budget 819s gives ~1.8x:
#   red_team ~240s (13k tok) · argument 275s (19k) · completeness 325s (17k)
#   voice_style 357s (21k) · fact_check 456s (30k)
# sonar-reasoning-pro (grounded): originally observed 59-141s, but later runs hit
# 233.93s (succeeded, right at the old 240s wall-clock edge) and then hit the 240s
# ceiling outright (unknown true value beyond that). model_multiplier raised
# 3.0 -> 5.0 below so this cell has real margin instead of running at the edge.

base_seconds: 60
# Grok's computed value clamps to this floor and ran with <10s headroom repeatedly
# in a maximum-preset run (4/5 calls 51-55s against the old 60s floor; one timed
# out outright). Raised 60 -> 90 for real margin.
floor_seconds: 90

# Global safety buffer applied to every computed timeout, on top of the multipliers.
# The multipliers target TYPICAL (central) completion time; this margin covers the
# run-to-run variance these reasoning/grounded calls show (output volume swings, and
# grounded search latency varies widely). Sized so each cell clears its observed tail:
# mistral high seen >285s (budget→341), gemini grounded seen 220s (→300), gpt-5.5
# xhigh seen >632s (→1024). Raise for more headroom; lower to fail-fast sooner.
#
# 1.25 -> 2.5 (2026-08-16). Two reasons to be generous here now:
#
#   * Provider load is a real, unmeasured axis. Published monitoring puts peak-hour
#     latency at roughly 2x off-peak (OpenAI P99 3-5x its P50; Anthropic ~1.8x
#     P95/P50), and nothing we run samples the clock densely enough to tell a slow
#     model from a busy afternoon. A flat 2x absorbs the whole diurnal envelope
#     without needing a time-of-day table nobody can calibrate.
#   * Since the read-gap split (see ci_core/llm/streaming.py) this value governs
#     ONLY the wall-clock backstop, whose sole job is "this call is alive but I am
#     not waiting any longer". Dead connections are caught by the inter-chunk gap
#     in ~60s regardless of what this says. Over-sizing it therefore costs almost
#     nothing, while under-sizing it throws away a call that was going to succeed
#     — along with the elapsed-time measurement needed to size the cell correctly.
#
# NOTE: several cells are clamped by task_timeout_seconds (default 1100 -> 1085)
# before this margin can apply — openai/gpt-5.5 xhigh already sits at the clamp, so
# raising this does nothing for it. Raise task_timeout_seconds if the wall-clock
# genuinely needs to go higher; that is a "how long am I willing to wait" decision,
# not a latency measurement.
variance_margin: 2.5

# By draft character count. 62k (this calibration doc) sits in the 1.0 anchor bucket.
# SMALL-DRAFT BUCKETS, revised 2026-09-04. 0.4 and 0.6 assumed a short draft is
# a cheap call. It is not, and this file already says why: generation time is
# driven by OUTPUT length, and output is bounded by what the domain prompt asks
# for rather than by how much input was read. Measured on a 2,182-char draft,
# grok emitted 12,032 output tokens and took 377.61s — longer than its worst
# *measurable* call on a 130,190-char draft. Scaling the budget down by 60% for
# a small draft contradicted the model's own stated principle, and the cost of
# it was borne entirely by whichever model was slowest.
size_multipliers:
  - { max_chars: 5000,   mult: 0.7 }
  - { max_chars: 20000,  mult: 0.8 }
  - { max_chars: 50000,  mult: 0.85 }
  - { max_chars: 80000,  mult: 1.0 }    # calibration anchor (~62k)
  - { max_chars: 150000, mult: 1.4 }
  - { max_chars: null,   mult: 1.8 }    # everything larger

# Prefix match, longest key first (like the pricing table).
# Grounded models (gemini, sonar) carry a high base because their search latency
# is large and variable by domain, and isn't captured by a reasoning-effort knob.
#
# WHY SOME OF THESE LOOK ABSURD (gemini 4.0, sonar 7.0, grok 2.0): those three
# providers have no reasoning_effort parameter at all — gemini uses thinking_budget,
# grok selects reasoning by model name, perplexity has no knob — so they fall through
# to effort_multipliers.default (1.0) and their model multiplier ends up carrying the
# reasoning cost as well as the model cost. The number is doing two jobs. Don't
# "clean it up" by comparing it against gpt-5.4's 1.0; they are not measuring the
# same thing. Splitting the axes properly is only worth it if these cells start
# drifting again now that the wall-clock is a backstop rather than a tight budget.
model_multipliers:
  grok:               5.5   # MEASURED 2026-09-03, and the first time this cell has
                            # been set from real numbers rather than from a ceiling
                            # a call had just hit. A wall-clock bug meant no
                            # per-call budget was actually enforced that run, which
                            # accidentally produced exactly the --no-timeout
                            # condition this file asks for: grok-4.6 ran to
                            # completion five times at 2,182 chars, taking 17.58s,
                            # 143.34s, 232.51s, 310.06s and 377.61s. Median 232.51s
                            # is the "typical" the multipliers target; the 2.5
                            # variance_margin then covers the tail, giving ~581s
                            # against a 377.61s worst case.
                            #
                            # 5.5 looks large next to gpt-5.4's 1.0 for the reason
                            # given above: grok has no reasoning_effort parameter,
                            # so effort_multipliers.default (1.0) applies and this
                            # cell carries the reasoning cost as well as the model
                            # cost. Compare it to sonar's 7.0, not to gpt-5.4's 1.0.
                            #
                            # Previously 2.0 # was 1.2 (-> 126s at the 1.4 size bucket), which grok used
                            # 100% of on a 130k-char run: completeness timed out at 126s
                            # and two more domains landed within 14s of the ceiling
                            # (111.8s, 112.83s). The 1.2 was set when grok ran 16-51s at
                            # ~74k chars; the grok-4.x reasoning variant is far slower
                            # than that figure. 2.0 -> 210s, ~1.85x the slowest call that
                            # actually completed — the same margin gpt-5.5 xhigh carries
                            # (819s budget vs 456s observed). The true completeness time
                            # is still unknown: it was cut off, not measured.
  gpt-5.4:            1.0
  gpt-5.5:            1.3
  mistral-small:      0.8
  mistral-large:      1.0
  mistral-medium-3-5: 1.7   # high effort is heavy-tailed & provider-latency-variable:
                            # voice_style timed out >326s at the old 1.3 (budget 341). 1.7 → ~446s.
  gemini:             4.0   # grounded fact_check observed up to 220s
  sonar:              7.0   # 5.0 (-> 375s) was hit directly by completeness in a later
                             # run ("Timed out after 375s"), on top of the read-gap
                             # (stream_read_timeout in presets.yaml) failing 3 bumps in
                             # a row on the same run's other domains. Raised decisively
                             # (5.0 -> 7.0, -> 525s) to sit above the new 500s read-gap
                             # rather than nudge again; see presets.yaml's note.
  default:            1.0

# From reasoning_effort / effort in the model config. Calibration showed effort is
# the steep, dominant axis: same model, none→high was ~5×. Models with no reasoning
# param (grok reasoning variant, gemini thinking_budget, perplexity) use 'default'.
effort_multipliers:
  none:    1.0
  low:     1.15
  medium:  2.0
  high:    3.5
  xhigh:   10.5  # gpt-5.5 xhigh × model 1.3 × base 60 ≈ 819s at the 1.0 size anchor.
                 # Raised from 8.3 after a run showed gpt-5.5 xhigh exceed 632s on
                 # this doc (heavy tail; typical 240-360s but occasional long outliers).
  default: 1.0

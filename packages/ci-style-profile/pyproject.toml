[project]
name = "ci-style-profile"
version = "0.1.0"
description = "Synthesize a writing-style profile from a multi-source corpus"
requires-python = ">=3.10"
dependencies = [
    "ci-core",
    "requests>=2.31",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    "ruamel.yaml>=0.18",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "msal>=1.20",
    "python-docx>=1.1",
]

[project.scripts]
style-profile-bootstrap = "ci_style_profile.bootstrap:main"

[tool.uv.sources]
ci-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Runtime state that lives INSIDE the package directory: bootstrap.py keeps its
# staging corpus (which can hold Gmail, Outlook and Twitter text),
# `.watermarks.json` and sources.yaml there, and output.py its profile
# snapshots. The repo-root .gitignore ignores all three, but hatchling does not
# honour those lines. It finds that file by walking up from this directory, then
# matches every line against paths relative to THIS directory rather than the
# file's own (pypa/hatch#304, open), so the anchored
# `packages/ci-style-profile/src/ci_style_profile/staging/` never matches
# `src/ci_style_profile/staging/...`. Lines with no leading path (.env, *.pem,
# credentials*.json) match at any depth and were never affected. Measured
# 2026-09-19 on hatchling 1.32.3: staging/, profiles/ and sources.yaml all
# shipped, in the wheel and in the sdist.
#
# `exclude` is added to the .gitignore's patterns, not a replacement for them,
# and is relative to this directory. It is set here, not on the wheel target
# alone, because `uv build` (and `make build`) makes an sdist too. A target's own
# `exclude` REPLACES this list for that target, so do not add one without
# repeating these. tests/test_packaging.py builds both artifacts and fails if an
# entry the root .gitignore names under src/ci_style_profile/ is missing here.
exclude = [
    "/src/ci_style_profile/sources.yaml",
    "/src/ci_style_profile/staging/",
    "/src/ci_style_profile/profiles/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_style_profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Duplicated from the root pyproject.toml, which is the inifile for the
# repo-wide `pytest packages/` run. This one is what pytest reads when the
# package's own tests are run directly, and a `slow` test lives here too
# (test_callers.py's process-exit regression, which must pay litellm's import
# cost in a subprocess before it can observe interpreter exit at all).
markers = [
    "slow: inherently wall-clock-bound; deselect with -m 'not slow'",
]

# Duplicated from the root pyproject.toml for the same reason the markers
# above are: the root file is the inifile only for the repo-wide
# `pytest packages/` run, and this one is what pytest reads when this
# package's tests are run directly or a single file is passed. Without it
# the socket guard silently does not apply to exactly the invocation a
# developer iterating on one file uses. The root file says what
# `-p socket_guard` adds; `pythonpath` is relative to this file.
#
# `--import-mode=importlib` too, so tests import the same way here as they do
# repo-wide. tests/ is deliberately not a package (no __init__.py; conftest.py
# at the repo root has why), and under pytest's default prepend mode a relative
# import between test modules, like ci-article-review's, would raise
# ImportError when the package is run on its own, and pass in the repo-wide run.
addopts = "--import-mode=importlib --disable-socket --allow-hosts=127.0.0.1,::1 -p socket_guard"
pythonpath = ["../../pytest_plugins"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# Style profile bootstrap presets
# Five tiers: economy → maximum
# Individual sources.yaml keys override specific preset values.
# CLI --style and --max-styles override preset style settings.
#
# `models:` is laid over the `models:` block of configs/user.yaml, key by key
# (bootstrap._apply_preset_models). A key named here replaces the user's, a key
# left out stays the user's, `provider` is never replaced, and a provider the
# user has not configured is skipped. Leaving `effort` out does not turn
# thinking off: claude-sonnet-5 and claude-opus-5 think at high with none set
# (ci_core.llm.output_tokens._EFFORT_WHEN_UNSET).
#
# This file is required. A missing or malformed one raises PackagedConfigError,
# and the CLI's --preset choices must name the same five tiers.

economy:
  style_mode: canonical
  max_input_chars: 40000
  max_styles: 0
  per_style_min_words: 1000
  synthesis_models: [claude]
  detection_models: []
  models:
    claude:
      model: claude-haiku-4-5-20251001
      effort: low
    openai:
      model: gpt-6-luna   # was gpt-5.6-luna; gpt-6 refresh 2026-09-30, see ci-article-review's presets.yaml
    gemini:
      model: gemini-3.5-flash-lite   # was gemini-2.5-flash-lite; 2.5 retires on Vertex AI 2026-10-20.
      thinking_level: low            # `low` does not search (measured 2026-09-27); style analysis has no use for it.
                                     # See ci-article-review's presets.yaml, "Gemini refresh".
    mistral:
      model: mistral-small-latest

standard:
  style_mode: detect
  max_input_chars: 80000
  max_styles: 3
  per_style_min_words: 1500
  synthesis_models: [claude, openai]
  detection_models: [claude]
  models:
    claude:
      model: claude-haiku-4-5-20251001
    openai:
      model: gpt-6.1-sol   # was gpt-5.6-terra; gpt-6 refresh 2026-09-30, see ci-article-review's presets.yaml
    gemini:
      model: gemini-3.5-flash-lite   # was gemini-2.5-flash
      thinking_level: low
    mistral:
      model: mistral-large-latest

balanced:
  style_mode: detect
  max_input_chars: 120000
  max_styles: 5
  per_style_min_words: 2000
  synthesis_models: []
  detection_models: []
  models:
    claude:
      model: claude-sonnet-5   # was claude-sonnet-4-6; 2026-08-18 refresh
    openai:
      model: gpt-6.1-sol   # was gpt-5.6-terra; gpt-6 refresh 2026-09-30, see ci-article-review's presets.yaml
    gemini:
      model: gemini-3.5-flash-lite   # was gemini-2.5-flash
      thinking_level: low
    mistral:
      model: mistral-large-latest

thorough:
  style_mode: detect
  max_input_chars: 160000
  max_styles: 7
  per_style_min_words: 2000
  synthesis_models: []
  detection_models: []
  models:
    claude:
      model: claude-sonnet-5   # was claude-sonnet-4-6; 2026-08-18 refresh
      effort: medium
    openai:
      model: gpt-6.1-sol   # was gpt-5.6-terra; gpt-6 refresh 2026-09-30, see ci-article-review's presets.yaml
      reasoning_effort: medium
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-pro
      thinking_level: low
    mistral:
      model: mistral-large-latest

maximum:
  style_mode: detect
  max_input_chars: 200000
  max_styles: 10
  per_style_min_words: 2000
  synthesis_models: []
  detection_models: "*"
  models:
    claude:
      model: claude-opus-5   # was claude-opus-4-8; 2026-08-18 refresh, same price
      effort: high
    openai:
      model: gpt-6.1-sol   # was gpt-5.6-terra; gpt-6 refresh 2026-09-30, see ci-article-review's presets.yaml
      reasoning_effort: high
    gemini:
      model: gemini-3.5-flash   # was gemini-2.5-pro + thinking_budget 8192; a budget does nothing on a 3.x model.
      thinking_level: low       # `medium` and `high` make 80 searches a call on 3.5 Flash; `low`, 20.
    mistral:
      model: mistral-large-latest
